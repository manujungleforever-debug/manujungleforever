<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #030807; --bg-grad: radial-gradient(ellipse at 50% 0%, #0a2e25 0%, #030807 70%);
    --hbg: rgba(3,8,7,0.9); --card: rgba(11,38,35,0.50); --bdr: rgba(45,212,191,0.14);
    --bdr-h: rgba(45,212,191,0.45); --fg: #f1f5f9; --muted: #94a3b8; --teal: #2dd4bf;
    --teal-g: rgba(45,212,191,0.28); --gold: #c9a84c; --gold-g: rgba(201,168,76,0.28);
    --danger: #ef4444; --green: #10b981; --surface: rgba(11,38,35,0.6);
    --border: rgba(45,212,191,0.14); --text: #f1f5f9; --w: #f1f5f9; --card2: rgba(20,50,40,0.5);
}
html,body { height:100%; font-family:'Poppins',sans-serif; }
body { background: var(--bg) var(--bg-grad); color: var(--fg); min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden; opacity:0; transition:opacity .3s; }
input,textarea,select,button { font-family:inherit; }
a { color:var(--teal); }
header { position:sticky; top:0; z-index:200; background:var(--hbg); backdrop-filter:blur(14px); border-bottom:1px solid rgba(255,255,255,0.07); box-shadow:0 4px 24px rgba(0,0,0,.4); }
.hw { max-width:1400px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.logo-brand { display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0; }
.logo-wrap  { position:relative; display:flex; align-items:center; }
.logo-glow  { position:absolute; inset:-5px; background:var(--teal); filter:blur(12px); opacity:.22; border-radius:50%; transition:.3s; }
.logo-brand:hover .logo-glow { opacity:.5; filter:blur(18px); }
.logo-wrap img { height:40px; width:auto; position:relative; z-index:2; }
.brand-name { font-weight:700; font-size:.9rem; letter-spacing:2px; text-transform:uppercase; background:linear-gradient(to right,var(--teal),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.btn-panel { display:inline-flex; align-items:center; gap:8px; background:rgba(45,212,191,0.12); border:1px solid rgba(45,212,191,0.3); color:var(--teal); padding:8px 18px; border-radius:10px; font-size:.83rem; font-weight:700; text-decoration:none; white-space:nowrap; transition:.25s; flex-shrink:0; }
.btn-panel:hover { background:var(--teal); color:#030807; box-shadow:0 0 14px var(--teal-g); }
nav.mnav { display:flex; align-items:center; gap:3px; flex-wrap:wrap; flex:1; }
nav.mnav a { font-size:.8rem; font-weight:500; color:var(--muted); text-decoration:none; padding:6px 11px; border-radius:8px; transition:.25s; white-space:nowrap; display:flex; align-items:center; gap:5px; }
nav.mnav a i { font-size:1.1rem; }
nav.mnav a:hover, nav.mnav a.active { color:var(--teal); background:rgba(45,212,191,.09); }
.user-sec { display:flex; align-items:center; gap:10px; margin-left:auto; }
.btn-logout { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2); color:#f87171; cursor:pointer; font-size:.8rem; font-weight:600; padding:6px 12px; border-radius:8px; transition:.25s; display:flex; align-items:center; gap:6px; }
.btn-logout:hover { background:var(--danger); color:#fff; border-color:var(--danger); }
main { flex-grow:1; max-width:1400px; width:100%; margin:0 auto; padding:28px 24px 100px; position:relative; z-index:1; }
.pt { font-size:1.85rem; font-weight:700; letter-spacing:-.4px; background:linear-gradient(to right,#fff,#cbd5e1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; }
.ps { color:var(--muted); font-size:.87rem; margin-bottom:20px; }
.back-btn { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:var(--fg); padding:8px 16px; border-radius:9px; font-size:.82rem; font-weight:600; cursor:pointer; transition:.25s; margin-bottom:20px; }
.back-btn:hover { background:rgba(255,255,255,.12); }
.btn-primary { background:var(--teal); color:#030807; border:none; padding:9px 20px; border-radius:10px; font-weight:700; font-size:.83rem; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:.25s; }
.btn-primary:hover { background:#16c9b5; box-shadow:0 0 14px var(--teal-g); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; }
.btn-secondary { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); color:var(--fg); padding:8px 17px; border-radius:10px; font-size:.82rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.25s; }
.btn-secondary:hover { background:rgba(255,255,255,.11); }
.btn-danger { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.22); color:#f87171; padding:7px 15px; border-radius:9px; cursor:pointer; font-weight:600; font-size:.82rem; transition:.25s; }
.btn-danger:hover { background:var(--danger); color:#030807; border-color:var(--danger); }
.btn-edit { background:rgba(45,212,191,.09); border:1px solid rgba(45,212,191,.22); color:var(--teal); padding:7px 15px; border-radius:9px; cursor:pointer; font-weight:600; font-size:.82rem; transition:.25s; }
.btn-edit:hover { background:var(--teal); color:#030807; }
.list-grid, .blog-grid { display:grid; gap:12px; width:100%; box-sizing:border-box; }
.li, .blog-card-li { background:var(--card); backdrop-filter:blur(8px); border:1px solid var(--bdr); border-radius:14px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; box-sizing:border-box; transition:all .25s ease; overflow:hidden; }
.li:hover, .blog-card-li:hover { border-color:var(--bdr-h); transform:translateY(-1px); box-shadow:0 8px 24px rgba(45,212,191,.06); }
.blog-thumb { width:96px; height:66px; flex-shrink:0; border-radius:10px; overflow:hidden; background:#000; border:1px solid rgba(45,212,191,.25); }
.blog-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.li-info { flex:1 1 0%; min-width:0; overflow:hidden; }
.li-info h3 { font-size:.95rem; font-weight:600; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li-info span { font-size:.76rem; color:var(--muted); display:block; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.li-actions { display:flex; gap:8px; align-items:center; flex-shrink:0; }
.badge { display:inline-block; padding:3px 11px; border-radius:20px; font-size:.68rem; font-weight:700; margin-left:6px; text-transform:uppercase; }
.badge.on  { background:rgba(16,185,129,.15); color:#34d399; border:1px solid rgba(16,185,129,.25); }
.badge.off { background:rgba(239,68,68,.18);  color:#f87171; border:1px solid rgba(239,68,68,.3); }
.badge.warn{ background:rgba(245,158,11,.18); color:#fbbf24; border:1px solid rgba(245,158,11,.3); }
.eform { max-width:900px; display:flex; flex-direction:column; gap:17px; margin-bottom:60px; }
.esec { background:var(--card); backdrop-filter:blur(10px); border:1px solid var(--bdr); border-radius:16px; padding:22px; }
.esec-h { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--gold); border-bottom:1px solid rgba(255,255,255,.07); padding-bottom:8px; margin-bottom:16px; }
.grow2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grow3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.ff { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.ff label { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
.ff input,.ff textarea,.ff select { background:rgba(3,8,7,.65); border:1px solid rgba(255,255,255,.1); color:var(--fg); padding:10px 13px; border-radius:10px; font-size:.85rem; outline:none; transition:.25s; width:100%; }
.ff input:focus,.ff textarea:focus,.ff select:focus { border-color:var(--teal); box-shadow:0 0 10px var(--teal-g); }
.ff select option { background:#0a1f1b; color:var(--fg); }
.hint { font-size:.7rem; color:var(--muted); }
.save-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(3,8,7,.96); backdrop-filter:blur(16px); border-top:1px solid rgba(45,212,191,.3); padding:14px 28px; display:flex; align-items:center; justify-content:flex-end; gap:12px; z-index:99999; box-shadow:0 -8px 32px rgba(0,0,0,0.8); }
.save-status { font-size:.83rem; color:var(--muted); margin-right:auto; font-weight:500; }
.save-status.ok  { color:var(--green); }
.save-status.err { color:var(--danger); }
.md-wrap { border:1px solid rgba(255,255,255,.1); border-radius:10px; overflow:hidden; }
.md-toolbar { background:rgba(0,0,0,.22); border-bottom:1px solid rgba(255,255,255,.07); padding:6px; display:flex; gap:5px; flex-wrap:wrap; }
.md-toolbar button { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color:var(--fg); padding:5px 10px; border-radius:5px; cursor:pointer; font-size:.76rem; transition:.25s; }
.md-toolbar button:hover { background:var(--teal); color:#030807; }
.tgl-wrap { display:flex; align-items:center; gap:10px; }
.tgl { position:relative; display:inline-block; width:44px; height:24px; }
.tgl input { opacity:0; width:0; height:0; }
.tgl-s { position:absolute; inset:0; background:rgba(255,255,255,.1); border-radius:24px; transition:.3s; cursor:pointer; }
.tgl-s:before { content:''; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.3s; }
.tgl input:checked+.tgl-s { background:var(--teal); }
.tgl input:checked+.tgl-s:before { transform:translateX(20px); }
.img-field-wrap { display:flex; flex-direction:column; gap:6px; }
.img-input-row { display:flex; gap:8px; }
.img-input-row input { flex:1; }
.img-preview { width:100%; max-height:420px; min-height:200px; object-fit:contain; background:rgba(0,0,0,.45); border-radius:12px; margin-top:10px; padding:8px; border:1px dashed rgba(45,212,191,0.3); box-shadow:inset 0 0 20px rgba(0,0,0,0.5); display:none; }
.img-preview.show { display:block; }
.avatar-preview { width:120px; height:120px; object-fit:cover; object-position:center; border-radius:50%; margin-top:10px; border:2px solid var(--teal); box-shadow:0 4px 14px rgba(45,212,191,0.25); display:none; }
.avatar-preview.show { display:block; }
.sub-nav-tabs { display:flex; gap:7px; margin-bottom:22px; background:var(--card); padding:6px; border-radius:11px; border:1px solid var(--bdr); width:fit-content; }
.sub-nav-tabs button { background:none; border:none; color:var(--muted); padding:7px 15px; border-radius:8px; font-size:.82rem; font-weight:600; cursor:pointer; transition:.25s; }
.sub-nav-tabs button:hover,.sub-nav-tabs button.active { background:rgba(45,212,191,.12); color:var(--teal); }
.modal-bg { position:fixed; inset:0; background:rgba(2,6,5,.9); backdrop-filter:blur(7px); align-items:center; justify-content:center; z-index:400; display:none; padding:20px; }
.modal-bg.open { display:flex !important; }
.modal { background:rgba(11,38,35,.8); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.12); border-radius:18px; width:100%; max-width:600px; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 24px 56px rgba(0,0,0,.6); }
.modal.lg { max-width:920px; }
.modal-h { padding:16px 22px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,.14); border-radius:18px 18px 0 0; }
.modal-h h3 { font-size:.98rem; font-weight:700; color:var(--teal); }
.modal-body { padding:20px 22px; overflow-y:auto; display:flex; flex-direction:column; gap:13px; }
.modal-actions { padding:12px 22px; border-top:1px solid rgba(255,255,255,.08); background:rgba(0,0,0,.14); display:flex; justify-content:flex-end; gap:10px; align-items:center; border-radius:0 0 18px 18px; }
.loading { display:flex; align-items:center; gap:11px; color:var(--muted); font-size:.87rem; padding:28px 0; }
.spinner { width:20px; height:20px; border-radius:50%; border:2px solid rgba(45,212,191,.2); border-top-color:var(--teal); animation:spin .8s linear infinite; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }
.media-grid,.m-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px; }
.media-item,.m-item { background:var(--card); border:2px solid var(--bdr); border-radius:9px; overflow:hidden; cursor:pointer; transition:.25s; position:relative; }
.media-item:hover,.m-item:hover { border-color:var(--teal); }
.media-item.selected,.m-item.selected { border-color:var(--teal); box-shadow:0 0 12px var(--teal-g); }
.media-item img,.media-item video,.m-item img,.m-item video { width:100%; height:84px; object-fit:cover; display:block; }
.media-item-name,.m-name { font-size:.62rem; color:var(--muted); padding:3px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.media-item-del,.btn-del { position:absolute; top:4px; right:4px; background:rgba(239,68,68,.85); color:#fff; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer; font-size:.68rem; display:none; align-items:center; justify-content:center; }
.media-item:hover .media-item-del,.m-item:hover .btn-del { display:flex; }
.empty { color:var(--muted); text-align:center; padding:40px; font-size:.88rem; }
code { background:rgba(45,212,191,.1); color:var(--teal); padding:2px 6px; border-radius:4px; font-size:.8em; }
.err-msg { color:#f87171; font-size:.82rem; margin-top:4px; display:none; }
.err-msg.show { display:block; }
@media (max-width:768px) {
    header .hw { padding:10px 14px; gap:10px; }
    .brand-name { font-size:.8rem; }
    nav.mnav { overflow-x:auto; white-space:nowrap; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
    nav.mnav::-webkit-scrollbar { display:none; }
    main { padding:16px 12px 100px; }
    .li,.blog-card-li { flex-wrap:wrap; padding:12px 14px; gap:10px; }
    .blog-thumb { width:70px; height:52px; }
    .li-info { flex:1 1 50%; min-width:0; }
    .li-actions { width:100%; justify-content:flex-end; border-top:1px solid rgba(255,255,255,0.06); padding-top:8px; margin-top:4px; }
    .grow2,.grow3 { grid-template-columns:1fr; }
    .save-bar { padding:10px 16px; flex-wrap:wrap; gap:8px; }
    .save-status { width:100%; margin-bottom:2px; }
}
</style>

<script>
const API = '/api/cms';
const MEDIA_API = '/api/media';
let token = sessionStorage.getItem('cms_token');
let cUser = sessionStorage.getItem('cms_user') || '';
let cSection = 'tours';
var cSha=null,cFile=null,cData=null,saveFnRef=null;
var currentMediaFiles=[],selectedMediaUrl=null,mediaSelectCallback=null;
var currentReclamosData=[],currentReclamoId=null;
window.sidebarItems=[];
window.activeSubSection=null;

window.addCustomItem = function(selectId, promptMsg) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  setTimeout(function() {
    const val = prompt(promptMsg || 'Ingrese el nuevo elemento:');
    if (val && val.trim()) {
      const cleanVal = val.trim();
      let opt = Array.from(sel.options).find(o => o.value.toLowerCase() === cleanVal.toLowerCase());
      if (!opt) {
        opt = document.createElement('option');
        opt.value = cleanVal;
        opt.textContent = cleanVal;
        const addOpt = Array.from(sel.options).find(o => o.value === '__add_new__');
        if (addOpt) { sel.insertBefore(opt, addOpt); } else { sel.appendChild(opt); }
      }
      sel.value = cleanVal;
      const saveBar = document.getElementById('save-bar');
      if (saveBar && saveFnRef) saveBar.style.display = 'flex';
    } else {
      const firstReal = Array.from(sel.options).find(o => o.value !== '__add_new__');
      if (firstReal) sel.value = firstReal.value;
    }
  }, 10);
};

function showSaveBar(fn,msg){
  saveFnRef=fn;
  document.getElementById('save-bar').style.display='flex';
  const ss=document.getElementById('save-status');
  ss.textContent=msg||'';ss.className='save-status';
}
function hideSaveBar(){
  document.getElementById('save-bar').style.display='none';
  saveFnRef=null;
  const btn=document.getElementById('btn-save');
  if(btn){btn.disabled=false;btn.innerHTML='<i class="ph ph-floppy-disk"></i> Guardar cambios';}
}
document.getElementById('btn-save').addEventListener('click',async()=>{
  if(!saveFnRef)return;
  const btn=document.getElementById('btn-save');
  const ss=document.getElementById('save-status');
  btn.disabled=true;btn.innerHTML='<i class="ph ph-spinner ph-spin"></i> Guardando...';
  try{
    await saveFnRef();
    ss.textContent='Guardado correctamente';ss.className='save-status ok';
    btn.innerHTML='<i class="ph ph-check-circle"></i> Guardado ✓';

async function ghGet(path) {
  const r = await fetch(`${API}/file?path=${encodeURIComponent(path)}`,{headers:{Authorization:`Bearer ${token}`}});
  if (r.status===401){sessionStorage.clear();location.reload();}
  if (r.status===404){return {files:[]};}
  if (!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'Error al cargar');}
  return r.json();
}

async function ghPut(path, content, sha, msg) {
  const r = await fetch(`${API}/file`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify({path,content,sha,message:msg||`update: ${path}`})});
  if (r.status===401){sessionStorage.clear();location.reload();}
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error al guardar');
  return d;
}

async function ghDelete(path, sha, msg) {
  const r = await fetch(`${API}/file`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify({path,sha,message:msg||`delete: ${path}`})});
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error al eliminar');
  return d;
}

// R2 Media API
async function r2GetList() {
  const r = await fetch(`${MEDIA_API}`,{headers:{Authorization:`Bearer ${token}`}});
  if (r.status===401){sessionStorage.clear();location.reload();}
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error al cargar galería');
  return d.files || [];
}

async function r2Upload(file, progressEl) {
  if (progressEl) progressEl.textContent = 'Subiendo a R2...';
  const r = await fetch(`${MEDIA_API}`, {
    method: 'POST',
    headers: { 
      Authorization: `Bearer ${token}`, 
      'X-File-Name': encodeURIComponent(file.name),
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if (r.status===401){sessionStorage.clear();location.reload();}
  
  // Tratar de parsear JSON, si falla es porque Cloudflare devolvió HTML (ej. error 500)
  let d;
  try {
    d = await r.json();
  } catch(e) {
    throw new Error(`Error del servidor (HTTP ${r.status}). Verifica que MEDIA_BUCKET esté configurado.`);
  }
  
  if(!r.ok) throw new Error(d.error||'Error subiendo archivo');
  
  if (progressEl) { progressEl.textContent = '✓ Completado'; setTimeout(()=>progressEl.textContent='', 2000); }
  return d.file;
}

async function r2Delete(key) {
  const r = await fetch(`${MEDIA_API}/${encodeURIComponent(key)}`, {
    method: 'DELETE', headers: { Authorization: `Bearer ${token}` }
  });
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error eliminando archivo');
  return true;
}

function renderMediaGrid(container, files, isModal) {
  if (!files.length) {
    container.innerHTML = `<div class="empty">La galería está vacía.</div>`;
    return;
  }
  
  container.innerHTML = `<div class="media-grid">
    ${files.map((f, i) => {
      const isVideo = f.key.match(/\.(mp4|webm)$/i);
      return `
      <div class="m-item" onclick="selectMediaItem(${i}, this, ${isModal})">
        ${isVideo 
          ? `<video src="${f.url}" preload="metadata"></video>` 
          : `<img src="${f.url}" loading="lazy" alt="${f.key}">`}
        <div class="m-name">${f.key}</div>
        ${!isModal ? `<button class="btn-del" onclick="event.stopPropagation(); deleteMedia('${f.key}')">×</button>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function selectMediaItem(idx, el, isModal) {
  if (!isModal) return; // Solo selección en modal
  const parent = el.parentElement;
  parent.querySelectorAll('.m-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedMediaUrl = currentMediaFiles[idx].url;
  document.getElementById('media-confirm').disabled = false;
}

document.getElementById('media-confirm').onclick = () => {
  if (selectedMediaUrl && mediaSelectCallback) {
    mediaSelectCallback(selectedMediaUrl);
  }
  closeModal('media-modal');
};

async function handleMediaUploadEvent(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  e.target.value = '';
  
  const inModal = document.getElementById('media-modal').classList.contains('open');
  const progEl = document.getElementById(inModal ? 'media-upload-prog' : 'main-upload-prog');
  const body = document.getElementById('media-modal-body');
  
  let successCount = 0, errorCount = 0, lastError = '';
  
  for (let i=0; i<files.length; i++) {
    const file = files[i];
    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) continue;
    try {
      if (progEl) progEl.textContent = `Subiendo ${i+1}/${files.length}... (${file.name})`;
      await r2Upload(file, null);
      successCount++;
    } catch(err) {
      console.error(err); errorCount++; lastError = err.message;
    }
  }
  
  if (progEl) {
     progEl.textContent = `✓ Subidos: ${successCount}` + (errorCount ? `, ✗ Errores: ${errorCount}` : '');
     setTimeout(()=> { if(progEl) progEl.textContent=''; }, 5000);
  }
  
  if (errorCount > 0) {
    alert(`Ocurrieron ${errorCount} errores al subir.\\nÚltimo error: ${lastError}\\nSi es un error 500 o 503, revisa que Cloudflare tenga configurada la variable MEDIA_BUCKET correctamente o intenta en un par de minutos.`);
  }
  
  if (inModal) {
    body.innerHTML = `<div class="loading"><div class="spinner"></div> Actualizando...</div>`;
    currentMediaFiles = await r2GetList();
    renderMediaGrid(body, currentMediaFiles, true);
  } else {
    route('media'); // Si está en la vista principal
  }
}

function mdToolbar(textareaId) {
  const cmds = [
    ['**B**','**','**'],['*I*','*','*'],['~~S~~','~~','~~'],
    ['# H1','# ',''],['## H2','## ',''],['### H3','### ',''],
    ['🔗 Link','[','](url)'],['> Cita','> ',''],['- Lista','- ',''],

  ];
  return `<div class="md-wrap">
      <div class="md-toolbar">${cmds.map(([l,b,a])=>`<button type="button" onclick="mdWrap('${textareaId}','${b.replace(/\n/g,'\\n').replace(/'/g,"\\'")}','${a.replace(/\n/g,'\\n').replace(/'/g,"\\'")}')" title="${l}">${l}</button>`).join('')} <button type="button" onclick="openMediaModal((url) => { mdWrap('${textareaId}', '![alt](', url + ')') })" title="Insertar Imagen de R2">🖼️ R2</button></div>
    <textarea id="${textareaId}" style="width:100%; box-sizing:border-box; resize:vertical; min-height:320px; font-family:monospace; font-size:.83rem; line-height:1.6; border:none; border-radius:0; background:rgba(255,255,255,.03); padding:12px; color:var(--fg); outline:none;"></textarea>
  </div>`;
}

function mdWrap(id, before, after) {
  const ta = document.getElementById(id);
  if (!ta) return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  const sel=ta.value.substring(s,e);
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.focus(); ta.selectionStart=s+before.length; ta.selectionEnd=s+before.length+sel.length;
}

async function publishBlogPost(slug, fm, mdBody) {
  const tmplData = await ghGet('www.manujungleforever.com/data/post-template.html');
  let tmpl = tmplData.content;
  
  const htmlBody = marked.parse(mdBody);
  const dateStr = fm.date ? new Date(fm.date + 'T12:00:00').toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}) : '';
  const replaceAll = (str, find, replace) => str.split(find).join(replace);
  
  tmpl = replaceAll(tmpl, '{{TITLE}}', fm.title || '');
  tmpl = replaceAll(tmpl, '{{EXCERPT}}', fm.extracto || '');
  tmpl = replaceAll(tmpl, '{{IMAGE}}', fm.imagen || '');
  tmpl = replaceAll(tmpl, '{{DATE}}', dateStr);
  tmpl = replaceAll(tmpl, '{{CONTENT}}', htmlBody);
             
  const htmlPath = `www.manujungleforever.com/${slug}/index.html`;
  try {
    const existingHtml = await ghGet(htmlPath);
    await ghPut(htmlPath, tmpl, existingHtml.sha, `publish html: ${fm.title}`);
  } catch(e) {
    await ghPut(htmlPath, tmpl, null, `publish new html: ${fm.title}`);
  }
  
  const idxData = await ghGet('www.manujungleforever.com/data/posts-index.json');
  let idx = JSON.parse(idxData.content);
  const postEntry = {
    title: fm.title,
    date: fm.date,
    category: fm.categoria || 'Blog',
    excerpt: fm.extracto,
    image: fm.imagen,
    imagen_alt: fm.imagen_alt,
    publicado: fm.publicado,
    slug: slug,
    url: `${slug}/index.html`
  };
  
  const existingIdx = idx.posts.findIndex(p => p.slug === slug);
  if (existingIdx >= 0) {
    idx.posts[existingIdx] = postEntry;
  } else {
    idx.posts.unshift(postEntry);
  }
  await ghPut('www.manujungleforever.com/data/posts-index.json', JSON.stringify(idx, null, 2), idxData.sha, `update index: ${fm.title}`);
}

        </div>
        ${blogFields({title:'',date:new Date().toISOString().split('T')[0],categoria:'Wildlife',publicado:true,extracto:'',imagen:'',imagen_alt:''})}
      </div>
      <div class="esec"><div class="esec-h">Contenido (Markdown)</div>${mdToolbar('f-body')}</div>
    </div>`);
  document.getElementById('f-slug').addEventListener('input', e=>{
    document.getElementById('slug-preview').textContent=e.target.value+'.md';
  });
  showSaveBar(async()=>{
    const slug=document.getElementById('f-slug').value.trim();
    if(!slug)throw new Error('El slug es obligatorio');
    const path=`www.manujungleforever.com/posts/${slug}.md`;
    const fm=readBlogFields();
    const content=buildFM(fm,document.getElementById('f-body').value);
    const res=await ghPut(path,content,null,`new post: ${fm.title}`);
    cFile=path; cSha=res.sha;
    await publishBlogPost(slug, fm, document.getElementById('f-body').value);
    document.querySelector('.back-btn').textContent='← Blog (guardado ✓)';
  });
}

async function editBlog(path, sha) {
  set(`<div class="loading"><div class="spinner"></div></div>`);
  const data=await ghGet(path);
  cFile=path; cSha=data.sha;
  const fm=parseFM(data.content);
  set(`
    <button class="back-btn" onclick="route('blog')">← Volver al blog</button>
    <div class="eform">
      <div class="esec">
        <div class="esec-h">Información del Artículo</div>
        ${blogFields(fm)}
      </div>
      <div class="esec"><div class="esec-h">Contenido (Markdown)</div>${mdToolbar('f-body')}</div>
    </div>`);
  document.getElementById('f-body').value=fm.body||'';
  showSaveBar(async()=>{
    const fm2=readBlogFields();
    const content=buildFM(fm2,document.getElementById('f-body').value);
    const res=await ghPut(cFile,content,cSha,`update: ${fm2.title}`);
    cSha=res.sha;
    const slug = cFile.split('/').pop().replace('.md', '');
    await publishBlogPost(slug, fm2, document.getElementById('f-body').value);
  });
}

function blogFields(fm) {
  return `
    <div class="grow2">
      <div class="ff"><label>Título del artículo</label><input id="f-title" value="${esc(fm.title||'')}"></div>
      <div class="ff"><label>Fecha de publicación</label><input type="date" id="f-date" value="${esc(fm.date||'')}"></div>
    </div>
    <div class="grow2">
      <div class="ff"><label>Categoría</label>
        <select id="f-cat" onchange="if(this.value==='__add_new__') addCustomItem('f-cat', 'Nombre de la nueva categoría del blog:')">
        ${(() => {
          const baseCats = ['Wildlife', 'Conservation', 'Sustainability', 'Manu Park', 'Travel Tips'];
          const currentCat = fm.categoria || 'Wildlife';
          const allCats = Array.from(new Set([...baseCats, currentCat].filter(Boolean)));
          return allCats.map(c => `<option value="${esc(c)}" ${currentCat === c ? 'selected' : ''}>${esc(c)}</option>`).join('') +
                 '<option value="__add_new__" style="font-weight:bold;color:var(--teal);">+ Añadir nueva categoría...</option>';
        })()}
      </select>
      </div>
      <div class="ff"><label>Estado</label>
        <div class="tgl-wrap" style="margin-top:6px">
          <label class="tgl"><input type="checkbox" id="f-pub" ${fm.publicado!==false?'checked':''}><span class="tgl-s"></span></label>
          <span id="pub-lbl">${fm.publicado!==false?'✅ Publicado':'📝 Borrador'}</span>
        </div>
      </div>
    </div>
    <div class="ff"><label>Extracto (resumen para el listado)</label><textarea id="f-ext" style="min-height:70px">${esc(fm.extracto||'')}</textarea></div>
    ${imgWidget('f-img','Imagen de portada',fm.imagen||'','Recomendado: 1200×600px')}
    <div class="ff"><label>Texto alternativo de la imagen</label><input id="f-imgalt" value="${esc(fm.imagen_alt||'')}"></div>
    <script>document.getElementById('f-pub').addEventListener('change',e=>{document.getElementById('pub-lbl').textContent=e.target.checked?'✅ Publicado':'📝 Borrador';})<\/script>`;
}

function readBlogFields() {
  return {
    title:v('f-title'),date:v('f-date'),categoria:v('f-cat'),
    publicado:document.getElementById('f-pub')?.checked!==false,
    extracto:v('f-ext'),imagen:v('f-img'),imagen_alt:v('f-imgalt')
  };
}

window.filterDeps = function() {
  const q = document.getElementById('dep-search').value.toLowerCase();
  const st = document.getElementById('dep-filter-status').value;
  document.querySelectorAll('.dep-card').forEach(el => {
    const matchQ = el.dataset.tour.includes(q) || el.dataset.id.includes(q);
    const matchS = st === '' || el.dataset.status === st;
    el.style.display = (matchQ && matchS) ? 'flex' : 'none';
  });
};

window.adjPlaza = async function(idx, diff) {
  const s = cData.salidas[idx];
  const newVal = (s.plazas_disponibles||0) + diff;
  if (newVal < 0 || newVal > (s.plazas_totales||0)) return;
  s.plazas_disponibles = newVal;
  if (newVal === 0) s.estado = 'completo';
  else if (newVal <= 2) s.estado = 'limitado';
  else s.estado = 'disponible';
  
  set(`<div class="loading"><div class="spinner"></div> Actualizando plazas...</div>`);
  const res = await ghPut(cFile, JSON.stringify(cData, null, 2), cSha, `adj plaza: ${s.id}`);
  cSha = res.sha;
  await viewDeps();
};

window.viewPax = function(idx) {
  const s = cData.salidas[idx];
  const pax = s.pasajeros || [];
  
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">

  if (pax.length === 0) {
    html += `<div style="padding:20px;text-align:center;color:var(--muted)">No hay pasajeros registrados para esta salida.</div>`;
  } else {
    html += `<table style="width:100%;text-align:left;border-collapse:collapse;font-size:.85rem;">
      <tr style="border-bottom:1px solid rgba(255,255,255,.1);color:var(--muted)">
        <th style="padding:8px">Nombre / Pasaporte</th>
        <th style="padding:8px">Contacto</th>

        <td style="padding:8px"><a href="https://wa.me/${p.whatsapp.replace(/[^0-9]/g,'')}" target="_blank" style="color:var(--teal)">${p.whatsapp}</a><br><span style="color:var(--muted)">${p.email}</span></td>
        <td style="padding:8px;color:#fbbf24">${p.restricciones_dieteticas || '-'}<br>${p.condiciones_medicas || '-'}</td>
        <td style="padding:8px">
          <span class="badge ${p.estado_pago==='pagado'?'on':'warn'}">${p.estado_pago}</span><br>
          <span style="color:var(--muted)">Pagado: $${p.monto_pagado} / Saldo: $${p.saldo_pendiente}</span>
        </td>
      </tr>`;
    });
    html += `</table>`;
  }
  
  document.getElementById('media-modal-body').innerHTML = html;
  const headerTitle = document.getElementById('media-modal-body').parentElement.querySelector('.modal-h h3');
  if (headerTitle) headerTitle.innerHTML = '👥 Gestión de Pasajeros';

window.exportPaxCSV = function(idx) {
  const s = cData.salidas[idx];
  const pax = s.pasajeros || [];
  if(pax.length===0) return alert('No hay pasajeros');
  let csv = "Nombre,Nacionalidad,Pasaporte,WhatsApp,Email,Dietas,Medicas,Pagado,Saldo\n";
  pax.forEach(p => {
    csv += `"${p.nombre_completo}","${p.nacionalidad}","${p.pasaporte}","${p.whatsapp}","${p.email}","${p.restricciones_dieteticas}","${p.condiciones_medicas}",${p.monto_pagado},${p.saldo_pendiente}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `pasajeros-${s.id}.csv`;
  a.click();
};

function parseFM(raw) {
  const m=raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m) return {body:raw};
  const fm={};
  m[1].split('\n').forEach(line=>{
    const i=line.indexOf(':');
    if(i<0)return;
    const k=line.slice(0,i).trim();
    const val=line.slice(i+1).trim().replace(/^["']|["']$/g,'');
    fm[k]=val;
  });
  if(fm.publicado!==undefined) fm.publicado=fm.publicado!=='false';
  fm.body=m[2].trim();
  return fm;
}
function buildFM(fm,body) {
  const skip=['body'];
  let out='---\n';
  for(const [k,vv] of Object.entries(fm)){
    if(skip.includes(k))continue;
    const s=String(vv);
    const quoted=s.includes(':')||s.includes('"')||s.includes("'")?`"${s.replace(/"/g,'\\"')}"`:s;
    out+=`${k}: ${quoted}\n`;
  }
  return out+`---\n\n${body}`;
}

function filterReclamos() {
  const q = document.getElementById('r-search').value.toLowerCase();
  const t = document.getElementById('r-type').value;
  const f = document.getElementById('r-from').value;
  const to = document.getElementById('r-to').value;
  
  let list = window.currentReclamosData || [];
  
  if (q) {
    list = list.filter(x => 
      (x.codigo_reclamo||'').toLowerCase().includes(q) || 
      (x.nombres||'').toLowerCase().includes(q) || 
      (x.documento||'').includes(q)
    );
  }
  
  if (t !== 'Todos') {
    list = list.filter(x => x.tipo === t);
  }
  
  if (f) {
    const fd = new Date(f);
    list = list.filter(x => new Date(x.fecha.split(' ')[0]) >= fd);
  }
  
  if (to) {
    const td = new Date(to);
    list = list.filter(x => new Date(x.fecha.split(' ')[0]) <= td);
  }
  
  renderReclamosRows(list);
}

function exportReclamos() {
  const list = window.currentReclamosData || [];
  if (!list.length) return alert('No hay datos para exportar.');
  
  let csv = 'Código,Fecha,Cliente,Documento,Teléfono,Correo,Tipo,Estado\n';
  list.forEach(r => {
    csv += `"${r.codigo_reclamo}","${r.fecha}","${r.nombres}","${r.documento}","${r.telefono}","${r.correo}","${r.tipo}","${r.estado}"\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Reclamos_ManuJungle_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

  document.getElementById('mr-title').textContent = `${r.tipo.toUpperCase()} N° ${r.codigo_reclamo}`;
  document.getElementById('mr-subtitle').textContent = `Registrado el: ${r.fecha}`;
  document.getElementById('mr-cliente').textContent = r.nombres;
  document.getElementById('mr-dni').textContent = r.documento;
  document.getElementById('mr-tel').textContent = r.telefono;
  document.getElementById('mr-email').textContent = r.correo;
  document.getElementById('mr-domicilio').textContent = r.domicilio;
  
  document.getElementById('mr-detalle').textContent = r.detalle;
  document.getElementById('mr-pedido').textContent = r.pedido;
  
  if (r.estado === 'Atendido') {
    document.getElementById('mr-respuesta-box').style.display = 'none';
    document.getElementById('mr-atendido-box').style.display = 'block';
    document.getElementById('mr-fecha-res').textContent = r.fecha_respuesta || 'Desconocida';
    document.getElementById('mr-respuesta-texto').textContent = r.detalle_respuesta || '';
    document.getElementById('mr-btn-send').style.display = 'none';
  } else {
    document.getElementById('mr-atendido-box').style.display = 'none';
    document.getElementById('mr-respuesta-box').style.display = 'block';
    document.getElementById('mr-reply').value = '';
    document.getElementById('mr-status').style.display = 'none';

    document.getElementById('mr-btn-send').disabled = false;
    document.getElementById('mr-btn-send').innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Enviar Respuesta';

  openModal('modal-reclamo');

async function submitReclamoReply() {
  const id = window.currentReclamoId;
  const reply = document.getElementById('mr-reply').value.trim();
  const statusDiv = document.getElementById('mr-status');
  const btn = document.getElementById('mr-btn-send');
  
  if (!reply) {
    statusDiv.style.display = 'block';
    statusDiv.style.background = 'rgba(239,68,68,0.1)';
    statusDiv.style.color = 'var(--danger)';
    statusDiv.innerHTML = '⚠️ Debe escribir una respuesta oficial.';
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Enviando...';
  statusDiv.style.display = 'none';
  
  try {
    const r = await fetch('/api/admin/responder-reclamo', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${sessionStorage.getItem('cms_token')}`
      },
      body: JSON.stringify({ id: id, detalle_respuesta: reply })
    });
    
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error enviando respuesta');
    
    statusDiv.style.display = 'block';
    statusDiv.style.background = 'rgba(16,185,129,0.1)';
    statusDiv.style.color = 'var(--green)';
    statusDiv.innerHTML = '✅ Respuesta enviada y reclamo actualizado exitosamente.';
    
    setTimeout(() => {
      closeModal('modal-reclamo');
      viewReclamos(); // Recargar vista
    }, 2000);
    
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Enviar Respuesta';
    statusDiv.style.display = 'block';
    statusDiv.style.background = 'rgba(239,68,68,0.1)';
    statusDiv.style.color = 'var(--danger)';
    statusDiv.textContent = `Error: ${e.message}`;
  }
}

window.updateImgPreview = function(inputId, previewId) {
  const inp = document.getElementById(inputId);
  const prev = document.getElementById(previewId);
  if (!inp || !prev) return;
  if (inp.value && inp.value.trim()) {
    prev.src = inp.value.trim();
    prev.classList.add('show');
  } else {
    prev.classList.remove('show');
  }
  const saveBar = document.getElementById('save-bar');
  if (saveBar && saveFnRef) {
    saveBar.style.display = 'flex';
  }
};

window.deleteBlog = async function(path, sha, name) {
  if (confirm(`¿Estás seguro de eliminar permanentemente el artículo "${name}"?`)) {
    set(`<div class="loading"><div class="spinner"></div> Eliminando artículo...</div>`);
    try {
      await ghDelete(path, sha, `delete post: ${name}`);
      const slug = path.split('/').pop().replace('.md', '');
      try {
        const htmlFile = await ghGet(`www.manujungleforever.com/${slug}/index.html`);
        if (htmlFile && htmlFile.sha) {
          await ghDelete(`www.manujungleforever.com/${slug}/index.html`, htmlFile.sha, `delete post html: ${slug}`);
        }
      } catch(e){}
      
      try {
        const idxData = await ghGet('www.manujungleforever.com/data/posts-index.json');
        let idx = JSON.parse(idxData.content);
        idx.posts = (idx.posts || []).filter(p => p.slug !== slug);
        await ghPut('www.manujungleforever.com/data/posts-index.json', JSON.stringify(idx, null, 2), idxData.sha, `remove from index: ${slug}`);
      } catch(e){}

      await viewBlog();
    } catch(e) {
      alert(`Error al eliminar artículo: ${e.message}`);
      await viewBlog();
    }
  }
};
