*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #030807;
    --bg-color: #030807;
    --bg-grad: radial-gradient(ellipse 80% 55% at 50% 0%, #0a2e25 0%, #030807 75%),
               radial-gradient(circle 500px at 90% 90%, rgba(201, 168, 76, 0.035) 0%, transparent 70%),
               #030807;
    --bg-gradient: radial-gradient(ellipse 80% 55% at 50% 0%, #0a2e25 0%, #030807 75%),
                   radial-gradient(circle 500px at 90% 90%, rgba(201, 168, 76, 0.035) 0%, transparent 70%),
                   #030807;
    --hbg: rgba(3, 8, 7, 0.88);
    --card: rgba(11, 38, 35, 0.50);
    --card-hover: rgba(14, 48, 44, 0.65);
    --bdr: rgba(45, 212, 191, 0.14);
    --bdr-h: rgba(45, 212, 191, 0.45);
    --fg: #f1f5f9;
    --muted: #94a3b8;
    --teal: #2dd4bf;
    --teal-g: rgba(45, 212, 191, 0.28);
    --gold: #c9a84c;
    --gold-g: rgba(201, 168, 76, 0.28);
    --danger: #ef4444;
    --green: #10b981;
    --font-sans: 'Poppins', sans-serif;
    --card2: rgba(20, 50, 40, 0.50);
}
html, body { height: 100%; font-family: 'Poppins', sans-serif; }
body {
    background-color: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
    opacity: 0;
    transition: opacity .3s;
}
#pg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
input,textarea,select,button { font-family:inherit; }
a { color:var(--teal); }
header { position:sticky; top:0; z-index:200; background:var(--hbg); backdrop-filter:blur(14px); border-bottom:1px solid rgba(255,255,255,0.07); box-shadow:0 4px 24px rgba(0,0,0,.4); }
.hw { max-width:1400px; margin:0 auto; padding: 20px 30px; display:flex; align-items:center; gap:14px; flex-wrap:nowrap; }
.logo-brand { display:flex; align-items:center; gap:10px; text-decoration:none; flex-shrink:0; }
.logo-wrap  { position:relative; display:flex; align-items:center; }
.logo-glow  { position:absolute; inset:-5px; background:var(--teal); filter:blur(12px); opacity:.22; border-radius:50%; transition:.3s; }
.logo-wrap img { height:40px; width:auto; position:relative; z-index:2; }
.btn-panel { display:inline-flex; align-items:center; gap:8px; background:rgba(45,212,191,0.12); border:1px solid rgba(45,212,191,0.3); color:var(--teal); padding:8px 18px; border-radius:10px; font-size:.83rem; font-weight:700; text-decoration:none; white-space:nowrap; transition:.25s; flex-shrink:0; }
.btn-panel:hover { background:var(--teal); color:#030807; box-shadow:0 0 14px var(--teal-g); }
nav.mnav { display:flex; align-items:center; gap:3px; flex-wrap:nowrap; flex:1; }
nav.mnav a { font-size:.8rem; font-weight:500; color:var(--muted); text-decoration:none; padding:6px 11px; border-radius:8px; transition:.25s; white-space:nowrap; display:flex; align-items:center; gap:5px; }
nav.mnav a:hover, nav.mnav a.active { color:var(--teal); background:rgba(45,212,191,.09); }
.user-sec { display:flex; align-items:center; gap:10px; margin-left:auto; }

main { flex-grow:1; max-width:1200px !important; width:100% !important; margin:0 auto !important; padding:28px 20px 100px !important; position:relative; z-index:1; box-sizing:border-box; }
.pt { font-size:1.85rem; font-weight:700; letter-spacing:-.4px; background:linear-gradient(to right,#fff,#cbd5e1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; }
.ps { color:var(--muted); font-size:.87rem; margin-bottom:20px; }
.back-btn { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:var(--fg); padding:8px 16px; border-radius:9px; font-size:.82rem; font-weight:600; cursor:pointer; transition:.25s; margin-bottom:20px; }
.back-btn:hover { background:rgba(255,255,255,.12); }
.btn-primary { background:var(--teal); color:#030807; border:none; padding:9px 20px; border-radius:10px; font-weight:700; font-size:.83rem; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:.25s; }
.btn-primary:hover { background:#16c9b5; box-shadow:0 0 14px var(--teal-g); }
.btn-secondary { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09); color:var(--fg); padding:8px 17px; border-radius:10px; font-size:.82rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.25s; }
.btn-secondary:hover { background:rgba(255,255,255,.11); }
.btn-danger { background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.22); color:#f87171; padding:7px 15px; border-radius:9px; cursor:pointer; font-weight:600; font-size:.82rem; transition:.25s; }
.btn-danger:hover { background:var(--danger); color:#030807; }
.btn-edit { background:rgba(45,212,191,.09); border:1px solid rgba(45,212,191,.22); color:var(--teal); padding:7px 15px; border-radius:9px; cursor:pointer; font-weight:600; font-size:.82rem; transition:.25s; }
.btn-edit:hover { background:var(--teal); color:#030807; }

.list-grid { display:grid; gap:12px; width:100%; box-sizing:border-box; }
.li { background:var(--card); backdrop-filter:blur(8px); border:1px solid var(--bdr); border-radius:14px; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; width:100%; box-sizing:border-box; transition:all .25s ease; }
.li:hover { border-color:var(--bdr-h); transform:translateY(-1px); box-shadow:0 8px 24px rgba(45,212,191,.06); }
.li-info { flex:1 1 0%; min-width:0; }
.li-info h3 { font-size:1rem; font-weight:600; color:var(--fg); display:flex; align-items:center; gap:10px; flex-wrap:nowrap; }
.li-info span { font-size:.8rem; color:var(--muted); display:block; margin-top:3px; }
.li-actions { display:flex; gap:8px; align-items:center; flex-shrink:0; }

.badge { display:inline-block; padding:3px 11px; border-radius:20px; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.badge.superuser { background:rgba(201,168,76,0.18); color:#fbbf24; border:1px solid rgba(201,168,76,0.35); }
.badge.normal { background:rgba(45,212,191,0.14); color:#34d399; border:1px solid rgba(45,212,191,0.28); }
.badge.on { background:rgba(16,185,129,.15); color:#34d399; border:1px solid rgba(16,185,129,.25); }
.badge.off { background:rgba(239,68,68,.18); color:#f87171; border:1px solid rgba(239,68,68,.3); }

.eform { max-width:1200px; width:100%; margin:0 auto 60px auto; display:flex; flex-direction:column; gap:18px; box-sizing:border-box; }
.esec { background:var(--card); backdrop-filter:blur(10px); border:1px solid var(--bdr); border-radius:16px; padding:22px; }
.esec-h { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--gold); border-bottom:1px solid rgba(255,255,255,.07); padding-bottom:8px; margin-bottom:16px; }
.grow2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.grow3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
.ff { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.ff label { font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
.ff input,.ff select { background:rgba(3,8,7,.65); border:1px solid rgba(255,255,255,.1); color:var(--fg); padding:10px 13px; border-radius:10px; font-size:.85rem; outline:none; transition:.25s; width:100%; }
.ff input:focus,.ff select:focus { border-color:var(--teal); box-shadow:0 0 10px var(--teal-g); }
.ff select option { background:#0a1f1b; color:var(--fg); }
.hint { font-size:.72rem; color:var(--muted); line-height:1.4; margin-top:2px; }

.avatar-upload-card { display:flex; align-items:center; gap:20px; flex-wrap:nowrap; background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.06); padding:16px; border-radius:14px; }
.avatar-preview-wrap { position:relative; width:88px; height:88px; border-radius:50%; flex-shrink:0; overflow:hidden; border:2px solid var(--teal); box-shadow:0 0 20px var(--teal-g); background:#061a15; display:flex; align-items:center; justify-content:center; }
.avatar-preview-wrap.superuser { border-color:var(--gold); box-shadow:0 0 20px var(--gold-g); }
.avatar-preview-img { width:100%; height:100%; object-fit:cover; display:none; }
.avatar-preview-img.show { display:block; }
.avatar-preview-placeholder { font-size:2rem; font-weight:700; color:var(--teal); }
.avatar-controls { flex:1; min-width:260px; display:flex; flex-direction:column; gap:8px; }

.save-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(3,8,7,.96); backdrop-filter:blur(16px); border-top:1px solid rgba(45,212,191,.3); padding:14px 28px; display:flex; align-items:center; justify-content:flex-end; gap:12px; z-index:99999; box-shadow:0 -8px 32px rgba(0,0,0,0.8); }
.save-status { font-size:.83rem; color:var(--muted); margin-right:auto; font-weight:500; }
.save-status.ok  { color:var(--green); }
.save-status.err { color:var(--danger); }

.card-icon-users { background: linear-gradient(135deg, #6366f1, #4338ca); color: #fff; box-shadow: 0 6px 20px rgba(99,102,241,0.35); }
.btn-card-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; margin-right: 16px; }

.btn-logout { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; border: none; cursor: pointer; font-size: .85rem; font-weight: 700; padding: 8px 16px; border-radius: 10px; transition: .3s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(239,68,68,0.35); }
.btn-logout:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239,68,68,0.5); }

.user-avatar { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.15rem; flex-shrink:0; overflow:hidden; }
.user-avatar.superuser { background:rgba(201,168,76,0.15); color:#fbbf24; border:2px solid rgba(201,168,76,0.4); }
.user-avatar.normal { background:rgba(45,212,191,0.15); color:#2dd4bf; border:2px solid rgba(45,212,191,0.4); }
.user-avatar-img { width:100%; height:100%; object-fit:cover; border-radius:50%; }

/* Modal Galería */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:999999; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.open { display:flex; }
.modal-box { background:#0a1a17; border:1px solid rgba(45,212,191,0.3); border-radius:18px; max-width:850px; width:100%; max-height:85vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.9); }
.modal-header { padding:18px 24px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:space-between; }
.modal-title { font-size:1.1rem; font-weight:700; color:var(--teal); }
.modal-close { background:none; border:none; color:var(--muted); font-size:1.4rem; cursor:pointer; }
.modal-body { padding:20px; overflow-y:auto; flex:1; }
.gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:12px; }
.gallery-item { aspect-ratio:1; border-radius:10px; overflow:hidden; cursor:pointer; border:2px solid transparent; transition:.2s; position:relative; background:#040d0a; }
.gallery-item:hover { border-color:var(--teal); transform:scale(1.03); }
.gallery-item img { width:100%; height:100%; object-fit:cover; }
</style>

<script>
const API = '/api/cms';
const MEDIA_API = '/api/media';
let token = sessionStorage.getItem('cms_token');
let cUser = sessionStorage.getItem('cms_user') || '';
let cRole = sessionStorage.getItem('cms_role') || 'normal';
var cSha=null, cFile='www.manujungleforever.com/data/users.json', cData=null, saveFnRef=null;

function set(h){ document.getElementById('mc').innerHTML=h; }
function v(id){ return document.getElementById(id)?.value??''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showSaveBar(fn,msg){
  saveFnRef=fn;
  document.getElementById('save-bar').style.display='flex';
  const ss=document.getElementById('save-status');
  ss.textContent=msg||''; ss.className='save-status';
}
function hideSaveBar(){
  document.getElementById('save-bar').style.display='none';
  saveFnRef=null;
}
document.getElementById('btn-save').addEventListener('click', async () => {
  if (!saveFnRef) return;
  const btn = document.getElementById('btn-save');
  const ss = document.getElementById('save-status');
  btn.disabled = true;
  if (window.showThinkingOverlay) window.showThinkingOverlay('Guardando cambios....');
  try {
    await saveFnRef();
    if (window.hideThinkingOverlay) window.hideThinkingOverlay();
    ss.textContent = 'Guardado correctamente';
    ss.className = 'save-status ok';
    btn.innerHTML = '<i class="ph ph-check-circle"></i> Guardado ✓';
    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Guardar cambios';
    }, 1500);
  } catch(e) {
    if (window.hideThinkingOverlay) window.hideThinkingOverlay();
    ss.textContent = 'Error: ' + e.message;
    ss.className = 'save-status err';
    btn.disabled = false;
    btn.innerHTML = '<i class="ph ph-floppy-disk"></i> Guardar cambios';

});
document.getElementById('btn-cancel-save').addEventListener('click',()=>{hideSaveBar();viewUsers();});

// API WRAPPERS (CENTRALIZED IN js/api.js)

// ── R2 UPLOAD HELPER ──
async function r2Upload(file, progressEl) {
  if (progressEl) progressEl.textContent = 'Subiendo a R2...';
  const r = await fetch(`${MEDIA_API}`, {
    method: 'POST',
    headers: { 
      Authorization: `Bearer ${token}`, 
      'X-File-Name': encodeURIComponent(file.name),
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if (r.status===401){sessionStorage.clear();location.reload();}
  
  let d;
  try {
    d = await r.json();
  } catch(e) {
    throw new Error(`Error del servidor (HTTP ${r.status}). Verifica la configuración de R2.`);
  }
  
  if(!r.ok) throw new Error(d.error||'Error subiendo archivo');
  return d.file;
}

// ── GALERÍA MODAL ──
let targetInputId = null;
let targetPrevId = null;

async function pickImage(inputId, prevId) {
  targetInputId = inputId;
  targetPrevId = prevId;
  document.getElementById('gallery-modal').classList.add('open');
  const grid = document.getElementById('gallery-grid');
  const loader = document.getElementById('gallery-loading');
  grid.innerHTML = '';
  loader.style.display = 'block';

  try {
    const r = await fetch(`${MEDIA_API}`, { headers: { Authorization: `Bearer ${token}` } });
    const d = await r.json();
    loader.style.display = 'none';
    const files = d.files || [];
    if (files.length === 0) {
      grid.innerHTML = '<p style="color:var(--muted);grid-column:1/-1;">No hay imágenes en R2 todavía.</p>';
      return;
    }
    files.forEach(f => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = `<img src="${esc(f.url)}" alt="img">`;
      item.onclick = () => {
        selectGalleryImage(f.url);
      };
      grid.appendChild(item);
    });
  } catch(e) {
    loader.textContent = 'Error al cargar galería: ' + e.message;
  }
}

function selectGalleryImage(url) {
  if (targetInputId) {
    const inp = document.getElementById(targetInputId);
    if (inp) inp.value = url;
  }
  if (targetPrevId) {
    updateAvatarPreview(targetInputId, targetPrevId);
  }
  closeGalleryModal();
}

function closeGalleryModal() {
  document.getElementById('gallery-modal').classList.remove('open');
  targetInputId = null;
  targetPrevId = null;
}

function updateAvatarPreview(inputId, prevId) {
  const inp = document.getElementById(inputId);
  const prev = document.getElementById(prevId);
  const placeholder = document.getElementById('avatar-placeholder');
  if (!inp || !prev) return;
  const url = inp.value.trim();
  if (url) {
    prev.src = url;
    prev.classList.add('show');
    if (placeholder) placeholder.style.display = 'none';
  } else {
    prev.src = '';
    prev.classList.remove('show');
    if (placeholder) placeholder.style.display = 'block';
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  if(!token)return;

    tsParticles.load('pg-particles', {

        number: { value: 24, density: { enable: true, area: 800 } },

        opacity: { value: 0.35, random: true, animation: { enable: true, speed: 0.4, minimumValue: 0.08, sync: false } },
        size: { value: 2.2, random: true, animation: { enable: true, speed: 0.6, minimumValue: 0.4, sync: false } },
        move: { enable: true, speed: 0.45, direction: 'top', random: true, straight: false, outModes: { default: 'out' } }
      },
      detectRetina: true
    });

});

async function viewUsers() {
  set('<div class="loading" style="padding:40px 0;display:flex;align-items:center;gap:12px;color:var(--muted);"><div class="spinner" style="width:20px;height:20px;border-radius:50%;border:2px solid rgba(45,212,191,.2);border-top-color:var(--teal);animation:spin .8s linear infinite;"></div> Cargando usuarios...</div>');
  try {
    const data = await ghGet(cFile);
    cSha = data.sha;
    cData = JSON.parse(data.content);
    const users = cData.users || [];

    const superCount = users.filter(u => u.role === 'superuser').length;
    const normalCount = users.filter(u => u.role === 'normal').length;

    let html = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:nowrap;gap:14px;">
        <div style="display:flex;align-items:center;">
          <div class="btn-card-icon card-icon-users"><i class="ph ph-users-three"></i></div>
          <div>
            <p class="pt" style="margin-bottom:0">Gestión de Usuarios y Perfiles</p>
            <p class="ps">${users.length} cuentas registradas con avatar y control de roles</p>
          </div>
        </div>
        <button class="btn-primary" onclick="editUser(-1)">+ Nuevo Usuario</button>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">
        <div class="esec" style="padding:16px;">
          <div style="font-size:1.8rem;font-weight:700;color:var(--gold);">${superCount}</div>
          <div style="font-size:0.8rem;color:var(--muted);">Super Usuarios (Acceso Total)</div>
        </div>
        <div class="esec" style="padding:16px;">
          <div style="font-size:1.8rem;font-weight:700;color:var(--teal);">${normalCount}</div>
          <div style="font-size:0.8rem;color:var(--muted);">Editores / Normales (Control de Posts)</div>
        </div>
        <div class="esec" style="padding:16px;">
          <div style="font-size:1.8rem;font-weight:700;color:#fff;">${users.length}</div>
          <div style="font-size:0.8rem;color:var(--muted);">Total de Cuentas</div>
        </div>
      </div>

      <div class="list-grid">`;

    users.forEach((u, i) => {
      const isSuper = u.role === 'superuser';
      const initial = (u.name || u.email).charAt(0).toUpperCase();
      const isProtected = ['kemmesik@gmail.com', 'jordyleonidas@manujungleforever.com'].includes(u.email.toLowerCase());
      const roleLabel = isSuper ? '⭐ SUPER USER' : '📝 EDITOR / NORMAL';
      const badgeCls = isSuper ? 'superuser' : 'normal';
      const foto = u.foto || u.avatar || '';

      const avatarMarkup = foto 
        ? `<div class="user-avatar ${badgeCls}"><img src="${esc(foto)}" class="user-avatar-img" alt="${esc(u.name)}" onerror="this.style.display='none';this.parentElement.textContent='${initial}';"></div>`
        : `<div class="user-avatar ${badgeCls}">${initial}</div>`;

      html += `
        <div class="li">
          <div style="display:flex;align-items:center;gap:16px;flex:1;min-width:0;">
            ${avatarMarkup}
            <div class="li-info">
              <h3>
                ${esc(u.name)} 
                <span class="badge ${badgeCls}">${roleLabel}</span>
                <span class="badge ${u.activo !== false ? 'on' : 'off'}">${u.activo !== false ? 'Activo' : 'Inactivo'}</span>
              </h3>
              <span>📧 <strong>${esc(u.email)}</strong> · Registrado: ${u.created_at ? u.created_at.split('T')[0] : '2026-08-19'} ${isProtected ? '· 🔒 Cuenta Principal Protegida' : ''}</span>
            </div>
          </div>
          <div class="li-actions">
            <button class="btn-edit" onclick="editUser(${i})"><i class="ph ph-pencil"></i> Editar Perfil / Clave</button>
            ${!isProtected ? `<button class="btn-danger" onclick="deleteUser(${i})" title="Eliminar usuario"><i class="ph ph-trash"></i></button>` : ''}
          </div>
        </div>`;
    });

    html += `</div>`;
    set(html);

  } catch(e) {
    set(`<p style="color:var(--danger);padding:20px;">❌ Error al cargar usuarios: ${e.message}</p>`);
  }
}

window.triggerUserAvatarUpload = function() {
  const name = document.getElementById('u-name') ? document.getElementById('u-name').value.trim() : '';
  const email = document.getElementById('u-email') ? document.getElementById('u-email').value.trim() : '';
  if (!name && !email) {

};

  const name = document.getElementById('u-name') ? document.getElementById('u-name').value.trim() : '';

  if (!name && !email) {

window.removeUserAvatar = function() {
  const inp = document.getElementById('u-foto');
  if (inp) {
    inp.value = '';
    updateAvatarPreview('u-foto', 'u-foto-prev');
  }
};

window.uploadUserAvatar = async function(input) {
  if (!input.files || input.files.length === 0) return;
  const file = input.files[0];
  const email = (document.getElementById('u-email')?.value.trim() || 'usuario').toLowerCase();
  const cleanEmail = email.replace(/[^a-z0-9_-]/gi, '-').replace(/-+/g, '-');
  const ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop().toLowerCase() : 'jpg';

  const fileName = `usuarios/${cleanEmail}/avatar_${Date.now()}.${ext}`;
  const renamedFile = new File([file], fileName, { type: file.type || 'image/jpeg' });

  const btn = document.getElementById('btn-upload-avatar');
  const oldText = btn ? btn.innerHTML : '';
  if (btn) {
    btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Subiendo...';
    btn.disabled = true;
  }

  try {
    const res = await r2Upload(renamedFile, null);
    const url = (typeof res === 'object' && res && res.url) ? res.url : (res || `/media/${fileName}`);
    const fotoInput = document.getElementById('u-foto');
    if (fotoInput) {
      fotoInput.value = url;
      updateAvatarPreview('u-foto', 'u-foto-prev');
    }
  } catch(e) {
    alert('Error al subir foto de perfil a R2: ' + e.message);
  } finally {
    if (btn) {
      btn.innerHTML = oldText;
      btn.disabled = false;
    }
    input.value = '';
  }
};

window.editUser = function(idx) {
  const u = idx === -1 
    ? { id: 'usr_' + Date.now(), email: '', name: '', role: 'normal', activo: true, password_hash: '', foto: '' } 
    : cData.users[idx];
  const isSuperAccount = ['kemmesik@gmail.com', 'jordyleonidas@manujungleforever.com'].includes((u.email || '').toLowerCase());
  const foto = u.foto || u.avatar || '';
  const initial = (u.name || u.email || 'U').charAt(0).toUpperCase();
  const isSuper = u.role === 'superuser';

  set(`
    <button class="back-btn" onclick="viewUsers()">← Volver a usuarios</button>
    <div class="eform">
      <!-- FOTO DE PERFIL / AVATAR -->
      <div class="esec">
        <div class="esec-h">Imagen de Perfil / Avatar</div>
        <div class="avatar-upload-card">
          <div class="avatar-preview-wrap ${isSuper ? 'superuser' : ''}">
            <img id="u-foto-prev" class="avatar-preview-img ${foto ? 'show' : ''}" src="${esc(foto)}" alt="Avatar">
            <span id="avatar-placeholder" class="avatar-preview-placeholder" style="display:${foto ? 'none' : 'block'};">${initial}</span>
          </div>
          <div class="avatar-controls">
            <div class="ff" style="margin-bottom:6px;">
              <label>Ruta o URL de Imagen</label>
              <input id="u-foto" value="${esc(foto)}" placeholder="https://... o sube una imagen" oninput="updateAvatarPreview('u-foto', 'u-foto-prev')">
            </div>
            <div style="display:flex;gap:8px;flex-wrap:nowrap;">
              <button type="button" class="btn-primary" id="btn-upload-avatar" onclick="triggerUserAvatarUpload()" style="background:#0284c7;color:white;border:none;" title="Subir desde tu dispositivo"><i class="ph ph-upload-simple"></i> Subir Foto</button>
              <button type="button" class="btn-primary" onclick="takeUserAvatarPhoto()" style="background:var(--teal);color:#030807;border:none;" title="Tomar foto con la cámara"><i class="ph ph-camera"></i> Tomar Foto</button>
              <button type="button" class="btn-secondary" onclick="pickImage('u-foto', 'u-foto-prev')" title="Elegir de galería R2"><i class="ph ph-image"></i> Galería</button>
              ${foto ? `<button type="button" class="btn-danger" onclick="removeUserAvatar()" title="Quitar foto"><i class="ph ph-trash"></i> Quitar</button>` : ''}
              <input type="file" id="u-upload-file" accept="image/*" style="display:none" onchange="uploadUserAvatar(this)">
              <input type="file" id="u-camera-file" accept="image/*" capture="environment" style="display:none" onchange="uploadUserAvatar(this)">
            </div>
            <span class="hint">Las fotos se guardan automáticamente en Cloudflare R2 organizadas en la carpeta <code>usuarios/{email}/</code>.</span>
          </div>
        </div>
      </div>

      <!-- DATOS DEL USUARIO -->
      <div class="esec">
        <div class="esec-h">${idx === -1 ? 'Crear Nuevo Usuario' : 'Datos del Usuario'}</div>
        <div class="grow2">
          <div class="ff">
            <label>Nombre Completo</label>
            <input id="u-name" value="${esc(u.name)}" placeholder="Ej: Gloria">
          </div>
          <div class="ff">
            <label>Correo Electrónico (Login)</label>
            <input type="email" id="u-email" value="${esc(u.email)}" placeholder="usuario@manujungleforever.com" ${isSuperAccount ? 'readonly style="opacity:0.75;"' : ''}>
          </div>
        </div>
        <div class="grow2">
          <div class="ff">
            <label>Rol de Usuario</label>
            <select id="u-role" ${isSuperAccount ? 'disabled' : ''}>
              <option value="superuser" ${u.role === 'superuser' ? 'selected' : ''}>⭐ Super User (Acceso total a todo el panel y usuarios)</option>
              <option value="normal" ${u.role === 'normal' ? 'selected' : ''}>📝 Editor / Normal (Gestión y edición de Posts y Contenido)</option>
            </select>
            ${isSuperAccount ? '<span class="hint">El rol de este Super Usuario está protegido.</span>' : ''}
          </div>
          <div class="ff">
            <label>Estado de Cuenta</label>
            <select id="u-act">
              <option value="true" ${u.activo !== false ? 'selected' : ''}>✅ Activo</option>
              <option value="false" ${u.activo === false ? 'selected' : ''}>🔒 Inactivo / Suspendido</option>
            </select>
          </div>
        </div>
      </div>

      <!-- SEGURIDAD -->
      <div class="esec">
        <div class="esec-h">Seguridad y Cambio de Contraseña</div>
        <div class="grow2">
          <div class="ff">
            <label>${idx === -1 ? 'Contraseña Inicial *' : 'Nueva Contraseña (Opcional)'}</label>
            <input type="password" id="u-pass" placeholder="${idx === -1 ? 'Mínimo 6 caracteres' : 'Dejar en blanco para mantener la actual'}">
            <span class="hint">Por defecto: <code>123456aytana</code></span>
          </div>
          <div class="ff">
            <label>Confirmar Contraseña</label>
            <input type="password" id="u-pass-conf" placeholder="Repite la contraseña">
          </div>
        </div>
      </div>
    </div>`);

  showSaveBar(async () => {
    const name = v('u-name').trim();
    const email = v('u-email').toLowerCase().trim();
    const role = isSuperAccount ? 'superuser' : v('u-role');
    const activo = v('u-act') === 'true';
    const foto = v('u-foto').trim();
    const pass = v('u-pass').trim();
    const passConf = v('u-pass-conf').trim();

    if (!name || !email) throw new Error('Nombre y correo son obligatorios.');

    let newHash = u.password_hash;
    if (idx === -1) {
      const finalPass = pass || '123456aytana';
      if (pass && pass !== passConf) throw new Error('Las contraseñas no coinciden.');
      newHash = await sha256(finalPass);
    } else {
      if (pass) {
        if (pass !== passConf) throw new Error('Las contraseñas no coinciden.');
        if (pass.length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres.');
        newHash = await sha256(pass);
      }
    }

    const updated = {
      id: u.id || ('usr_' + Date.now()),
      email,
      name,
      role,
      foto,
      password_hash: newHash,
      activo,
      created_at: u.created_at || new Date().toISOString(),
      updated_at: new Date().toISOString()
    };

    if (idx === -1) {
      if (cData.users.some(x => x.email.toLowerCase() === email)) {
        throw new Error('Ya existe un usuario con este correo electrónico.');
      }
      cData.users.unshift(updated);
    } else {
      cData.users[idx] = updated;
    }

    // Si es el usuario actual, actualizar la sesión
    if (email === cUser.toLowerCase()) {
      sessionStorage.setItem('cms_name', updated.name);
      sessionStorage.setItem('cms_avatar', updated.foto || '');
      const huser = document.getElementById('huser');
      if (huser && typeof window.isSuperUser === 'function') {
        const isSuper = window.isSuperUser();
        const roleBadge = isSuper 
          ? '<span style="font-size:0.68rem;background:rgba(201,168,76,0.2);color:#c9a84c;padding:2px 7px;border-radius:6px;margin-left:6px;border:1px solid rgba(201,168,76,0.3);">SUPER USER</span>'
          : '<span style="font-size:0.68rem;background:rgba(45,212,191,0.15);color:#2dd4bf;padding:2px 7px;border-radius:6px;margin-left:6px;border:1px solid rgba(45,212,191,0.3);">EDITOR</span>';
        const avatarHtml = updated.foto 
          ? `<img src="${esc(updated.foto)}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid ${isSuper ? '#c9a84c' : '#2dd4bf'};vertical-align:middle;margin-right:6px;display:inline-block;">`
          : `<span style="font-size:1rem;margin-right:4px;vertical-align:middle;">👤</span>`;
        huser.innerHTML = `${avatarHtml}<span style="vertical-align:middle;">${updated.name}</span> ${roleBadge}`;
      }
    }

    const res = await ghPut(cFile, JSON.stringify(cData, null, 2), cSha, `update user: ${updated.email}`);
    cSha = res.sha;
    document.querySelector('.back-btn').textContent = '← Usuarios (guardado ✓)';
    setTimeout(() => { viewUsers(); }, 1200);
  });
};

window.deleteUser = async function(idx) {
  const u = cData.users[idx];
  if (!u) return;
  if (['kemmesik@gmail.com', 'jordyleonidas@manujungleforever.com'].includes(u.email.toLowerCase())) {
    return alert('No puedes eliminar este Super Usuario principal.');
  }
  if (!confirm(`¿Estás seguro de eliminar permanentemente al usuario "${u.name} (${u.email})"?`)) return;

  cData.users.splice(idx, 1);
  const res = await ghPut(cFile, JSON.stringify(cData, null, 2), cSha, `delete user: ${u.email}`);
  cSha = res.sha;
  await viewUsers();
};
