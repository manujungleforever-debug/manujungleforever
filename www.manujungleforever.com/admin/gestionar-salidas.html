window.removeCustomGuide = function(selectId) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  const realOptions = Array.from(sel.options).filter(o => o.value && !o.value.startsWith('__'));
  if (!realOptions.length) {
    alert('No hay guías registrados para eliminar.');
    sel.value = '';
    return;
  }
  const guideListStr = realOptions.map((o, idx) => `${idx + 1}. ${o.value}`).join('\n');
  setTimeout(function() {
    const choice = prompt(`Escriba el NÚMERO o el NOMBRE del guía que desea eliminar de la lista:\n\n${guideListStr}`);
    if (choice && choice.trim()) {
      const cleanChoice = choice.trim();
      let target = null;
      const num = parseInt(cleanChoice, 10);
      if (!isNaN(num) && num >= 1 && num <= realOptions.length) {
        target = realOptions[num - 1].value;
      } else {
        const found = realOptions.find(o => o.value.toLowerCase() === cleanChoice.toLowerCase());
        if (found) target = found.value;
      }
      
      if (target) {
        if (confirm(`¿Eliminar al guía "${target}" de la lista?\n(Si hay salidas que lo tenían asignado, quedarán sin guía asignado).`)) {
          const optToRemove = Array.from(sel.options).find(o => o.value === target);
          if (optToRemove) optToRemove.remove();
          sel.value = '';
          if (window.cData && window.cData.salidas) {
            window.cData.salidas.forEach(s => {
              if (s.guia_asignado === target) s.guia_asignado = '';
            });
          }
          const saveBar = document.getElementById('save-bar');
          if (saveBar && saveFnRef) saveBar.style.display = 'flex';
          alert(`✓ Guía "${target}" eliminado correctamente.`);
        }
      } else {
        alert('❌ No se encontró el guía especificado.');
      }
    }
    sel.value = '';
  }, 10);
};

window.addCustomItem = function(selectId, promptMsg) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  setTimeout(function() {
    const val = prompt(promptMsg || 'Ingrese el nuevo elemento:');
    if (val && val.trim()) {
      const cleanVal = val.trim();
      let opt = Array.from(sel.options).find(o => o.value.toLowerCase() === cleanVal.toLowerCase());
      if (!opt) {
        opt = document.createElement('option');
        opt.value = cleanVal;
        opt.textContent = cleanVal;
        const addOpt = Array.from(sel.options).find(o => o.value === '__add_new__');
        if (addOpt) { sel.insertBefore(opt, addOpt); } else { sel.appendChild(opt); }
      }
      sel.value = cleanVal;
      const saveBar = document.getElementById('save-bar');
      if (saveBar && saveFnRef) saveBar.style.display = 'flex';
    } else {
      const firstReal = Array.from(sel.options).find(o => o.value !== '__add_new__');
      if (firstReal) sel.value = firstReal.value;
    }
  }, 10);
};

// R2 Media API
async function r2GetList() {
  const r = await fetch(`${MEDIA_API}`,{headers:{Authorization:`Bearer ${token}`}});
  if (r.status===401){sessionStorage.clear();location.reload();}
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error al cargar galería');
  return d.files || [];
}

async function r2Upload(file, progressEl) {
  if (progressEl) progressEl.textContent = 'Subiendo a R2...';
  const r = await fetch(`${MEDIA_API}`, {
    method: 'POST',
    headers: { 
      Authorization: `Bearer ${token}`, 
      'X-File-Name': encodeURIComponent(file.name),
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });
  if (r.status===401){sessionStorage.clear();location.reload();}
  
  // Tratar de parsear JSON, si falla es porque Cloudflare devolvió HTML (ej. error 500)
  let d;
  try {
    d = await r.json();
  } catch(e) {
    throw new Error(`Error del servidor (HTTP ${r.status}). Verifica que MEDIA_BUCKET esté configurado.`);
  }
  
  if(!r.ok) throw new Error(d.error||'Error subiendo archivo');
  
  if (progressEl) { progressEl.textContent = '✓ Completado'; setTimeout(()=>progressEl.textContent='', 2000); }
  return d.file;
}

async function r2Delete(key) {
  const r = await fetch(`${MEDIA_API}/${encodeURIComponent(key)}`, {
    method: 'DELETE', headers: { Authorization: `Bearer ${token}` }
  });
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error eliminando archivo');
  return true;
}

var mediaSelectCallback = null;
var currentMediaFiles = [];
var selectedMediaUrl = null;

async function openMediaModal(callback) {
  mediaSelectCallback = callback;
  selectedMediaUrl = null;
  document.getElementById('media-confirm').disabled = true;
  document.getElementById('media-modal').classList.add('open');
  
  const body = document.getElementById('media-modal-body');
  body.innerHTML = `<div class="loading"><div class="spinner"></div> Cargando galería...</div>`;
  
  try {
    currentMediaFiles = await r2GetList();
    renderMediaGrid(body, currentMediaFiles, true);
  } catch(e) {
    body.innerHTML = `<div class="err-msg" style="display:block">❌ ${e.message}</div>`;
  }
}

function renderMediaGrid(container, files, isModal) {
  if (!files.length) {
    container.innerHTML = `<div class="empty">La galería está vacía.</div>`;
    return;
  }
  
  container.innerHTML = `<div class="media-grid">
    ${files.map((f, i) => {
      const isVideo = f.key.match(/\.(mp4|webm)$/i);
      return `
      <div class="m-item" onclick="selectMediaItem(${i}, this, ${isModal})">
        ${isVideo 
          ? `<video src="${f.url}" preload="metadata"></video>` 
          : `<img src="${f.url}" loading="lazy" alt="${f.key}">`}
        <div class="m-name">${f.key}</div>
        ${!isModal ? `<button class="btn-del" onclick="event.stopPropagation(); deleteMedia('${f.key}')">×</button>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function selectMediaItem(idx, el, isModal) {
  if (!isModal) return; // Solo selección en modal
  const parent = el.parentElement;
  parent.querySelectorAll('.m-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedMediaUrl = currentMediaFiles[idx].url;
  document.getElementById('media-confirm').disabled = false;
}

document.getElementById('media-confirm').onclick = () => {
  if (selectedMediaUrl && mediaSelectCallback) {
    mediaSelectCallback(selectedMediaUrl);
  }
  closeModal('media-modal');
};

async function handleMediaUploadEvent(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  e.target.value = '';
  
  const inModal = document.getElementById('media-modal').classList.contains('open');
  const progEl = document.getElementById(inModal ? 'media-upload-prog' : 'main-upload-prog');
  const body = document.getElementById('media-modal-body');
  
  let successCount = 0, errorCount = 0, lastError = '';
  
  for (let i=0; i<files.length; i++) {
    const file = files[i];
    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) continue;
    try {
      if (progEl) progEl.textContent = `Subiendo ${i+1}/${files.length}... (${file.name})`;
      await r2Upload(file, null);
      successCount++;
    } catch(err) {
      console.error(err); errorCount++; lastError = err.message;
    }
  }
  
  if (progEl) {
     progEl.textContent = `✓ Subidos: ${successCount}` + (errorCount ? `, ✗ Errores: ${errorCount}` : '');
     setTimeout(()=> { if(progEl) progEl.textContent=''; }, 5000);
  }
  
  if (errorCount > 0) {
    alert(`Ocurrieron ${errorCount} errores al subir.\\nÚltimo error: ${lastError}\\nSi es un error 500 o 503, revisa que Cloudflare tenga configurada la variable MEDIA_BUCKET correctamente o intenta en un par de minutos.`);
  }
  
  if (inModal) {
    body.innerHTML = `<div class="loading"><div class="spinner"></div> Actualizando...</div>`;
    currentMediaFiles = await r2GetList();
    renderMediaGrid(body, currentMediaFiles, true);
  } else {
    route('media'); // Si está en la vista principal
  }
}

document.getElementById('media-upload').addEventListener('change', handleMediaUploadEvent);
document.getElementById('media-upload-folder').addEventListener('change', handleMediaUploadEvent);

function pickImage(inputId, previewId) {
  openMediaModal((url) => {
    const inp = document.getElementById(inputId);
    if (inp) inp.value = url;
    updateImgPreview(inputId, previewId);
  });
}

function fileToBase64(file) {
  return new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function updateImgPreview(inputId, previewId) {
  const val = document.getElementById(inputId)?.value;
  const prev = document.getElementById(previewId);
  if (!prev) return;
  if (val) { prev.src=val; prev.classList.add('show'); }
  else { prev.classList.remove('show'); }
}

function imgWidget(id, label, value='', hint='') {
  const pid=id+'-prev';
  return `<div class="ff"><label>${label}</label>
    <div class="img-field-wrap">
      <div class="img-input-row">
        <input id="${id}" value="${esc(value)}" placeholder="URL o ruta de imagen" oninput="updateImgPreview('${id}','${pid}')">
        <button type="button" class="btn-secondary" onclick="pickImage('${id}','${pid}')">🖼️ Seleccionar</button>
      </div>
      ${value ? `<img class="img-preview show" id="${pid}" src="${esc(value)}" alt="">` : `<img class="img-preview" id="${pid}" alt="">`}

function mdToolbar(textareaId) {
  const cmds = [
    ['**B**','**','**'],['*I*','*','*'],['~~S~~','~~','~~'],
    ['# H1','# ',''],['## H2','## ',''],['### H3','### ',''],
    ['🔗 Link','[','](url)'],['> Cita','> ',''],['- Lista','- ',''],
    ['1. Lista','1. ',''],['```Código','```\n','\n```'],
  ];
  return `<div class="md-wrap">
      <div class="md-toolbar">${cmds.map(([l,b,a])=>`<button type="button" onclick="mdWrap('${textareaId}','${b.replace(/\n/g,'\\n').replace(/'/g,"\\'")}','${a.replace(/\n/g,'\\n').replace(/'/g,"\\'")}')" title="${l}">${l}</button>`).join('')} <button type="button" onclick="openMediaModal((url) => { mdWrap('${textareaId}', '![alt](', url + ')') })" title="Insertar Imagen de R2">🖼️ R2</button></div>
    <textarea id="${textareaId}" style="width:100%; box-sizing:border-box; resize:vertical; min-height:320px; font-family:monospace; font-size:.83rem; line-height:1.6; border:none; border-radius:0; background:rgba(255,255,255,.03); padding:12px; color:var(--fg); outline:none;"></textarea>
  </div>`;
}

function mdWrap(id, before, after) {
  const ta = document.getElementById(id);
  if (!ta) return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  const sel=ta.value.substring(s,e);
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.focus(); ta.selectionStart=s+before.length; ta.selectionEnd=s+before.length+sel.length;
}

async function publishBlogPost(slug, fm, mdBody) {
  const tmplData = await ghGet('www.manujungleforever.com/data/post-template.html');
  let tmpl = tmplData.content;
  
  const htmlBody = marked.parse(mdBody);
  const dateStr = fm.date ? new Date(fm.date + 'T12:00:00').toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}) : '';
  const replaceAll = (str, find, replace) => str.split(find).join(replace);
  
  tmpl = replaceAll(tmpl, '{{TITLE}}', fm.title || '');
  tmpl = replaceAll(tmpl, '{{EXCERPT}}', fm.extracto || '');
  tmpl = replaceAll(tmpl, '{{IMAGE}}', fm.imagen || '');
  tmpl = replaceAll(tmpl, '{{DATE}}', dateStr);
  tmpl = replaceAll(tmpl, '{{CONTENT}}', htmlBody);
             
  const htmlPath = `www.manujungleforever.com/${slug}/index.html`;
  try {
    const existingHtml = await ghGet(htmlPath);
    await ghPut(htmlPath, tmpl, existingHtml.sha, `publish html: ${fm.title}`);
  } catch(e) {
    await ghPut(htmlPath, tmpl, null, `publish new html: ${fm.title}`);
  }
  
  const idxData = await ghGet('www.manujungleforever.com/data/posts-index.json');
  let idx = JSON.parse(idxData.content);
  const postEntry = {
    title: fm.title,
    date: fm.date,
    category: fm.categoria || 'Blog',
    excerpt: fm.extracto,
    image: fm.imagen,
    imagen_alt: fm.imagen_alt,
    publicado: fm.publicado,
    slug: slug,
    url: `${slug}/index.html`
  };
  
  const existingIdx = idx.posts.findIndex(p => p.slug === slug);
  if (existingIdx >= 0) {
    idx.posts[existingIdx] = postEntry;
  } else {
    idx.posts.unshift(postEntry);
  }
  await ghPut('www.manujungleforever.com/data/posts-index.json', JSON.stringify(idx, null, 2), idxData.sha, `update index: ${fm.title}`);
}

    }
    const res=await ghPut(cFile,JSON.stringify(cData,null,2),cSha,`update tour: ${updated.nombre}`);
    cSha=res.sha;

};

window.adjPlaza = async function(idx, diff) {
  const s = cData.salidas[idx];
  const newVal = (s.plazas_disponibles !== undefined ? s.plazas_disponibles : s.cupos_disponibles ?? s.plazas_totales ?? 8) + diff;
  if (newVal < 0 || newVal > (s.plazas_totales||8)) return;
  s.plazas_disponibles = newVal;
  s.cupos_disponibles = newVal;
  if (newVal === 0) s.estado = 'completo';
  else if (newVal <= 2) s.estado = 'limitado';
  else s.estado = 'disponible';
  
  if (window.showThinkingOverlay) window.showThinkingOverlay('Actualizando plazas...');
  try {
    const r = await fetch('/api/salidas/' + encodeURIComponent(s.id), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(s)
    });
    if (!r.ok) {
      await ghPut(cFile, JSON.stringify(cData, null, 2), cSha, `adj plaza: ${s.id}`);
    }
    await viewDeps();
  } catch(e) {
    console.error(e);
    alert('Error: ' + e.message);
  } finally {
    if (window.hideThinkingOverlay) window.hideThinkingOverlay();
  }
};

    window.checkCustom = function(sel, cId) {

    window.calcPaxPrice = function(source) {
    const epSelect = document.getElementById('p-ep');
    if (!epSelect) return;
    const state = epSelect.value;
    const costoInput = document.getElementById('p-costo');
    const total = Number(costoInput ? costoInput.value : 0);
    const mpInput = document.getElementById('p-mp');
    const spInput = document.getElementById('p-sp');
    
    let mp = Number(mpInput.value) || 0;
    let sp = Number(spInput.value) || 0;

    if (source === 'costo' || source === undefined) {
      if (state === 'pendiente') { mpInput.value = 0; spInput.value = total; }
      else if (state === 'pagado') { mpInput.value = total; spInput.value = 0; }
      else { spInput.value = Math.max(0, total - mp); }
    } else if (source === 'mp') {
      spInput.value = Math.max(0, total - mp);
      if (mp >= total && total > 0) epSelect.value = 'pagado';
      else if (mp === 0) epSelect.value = 'pendiente';
      else epSelect.value = 'reserva';
    } else if (source === 'sp') {
      mpInput.value = Math.max(0, total - sp);
      if (sp <= 0 && total > 0) epSelect.value = 'pagado';
      else if (sp >= total && total > 0) epSelect.value = 'pendiente';
      else epSelect.value = 'reserva';
    }
  };

window.uploadPaxPhoto = async function(input, sIdx) {
  if (!input.files || input.files.length === 0) return;
  const file = input.files[0];
  const nameInput = document.getElementById('p-n');
  const name = nameInput ? nameInput.value.trim() : '';
  const s = (cData && cData.salidas && (cData.salidas[sIdx] || cData.salidas.find(x => x.id === sIdx))) || {};
  
  // Carpeta personalizada con el nombre e identificador de la salida
  const safeSalida = (s.id || 'salida').toLowerCase().replace(/[^a-z0-9_-]/gi, '-');
  const safeTour = (s.tour_nombre || 'tour').toLowerCase().replace(/[^a-z0-9_-]/gi, '-').replace(/-+/g, '-');
  const folderDate = s.fecha_salida ? s.fecha_salida.replace(/[^a-z0-9_-]/gi, '-') : '';
  const folderName = folderDate ? `${safeSalida}_${safeTour}_${folderDate}` : `${safeSalida}_${safeTour}`;
  
  // Nombre del archivo con el nombre respectivo del pasajero
  const safeName = name ? name.toLowerCase().replace(/[^a-z0-9_-]/gi, '-').replace(/-+/g, '-') : ('pasajero_' + Date.now());
  const ext = (file.name && file.name.includes('.')) ? file.name.split('.').pop().toLowerCase() : 'jpg';
  
  const fileName = `pasajeros/${folderName}/${safeName}.${ext}`;
  const renamedFile = new File([file], fileName, { type: file.type || 'image/jpeg' });
  
  const btn = input.previousElementSibling || document.querySelector('#pax-modal button');
  const oldText = btn ? btn.innerHTML : '';
  if (btn) {
    btn.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Subiendo...';
    btn.disabled = true;
  }
  
  try {
    const res = await r2Upload(renamedFile, null);
    const url = (typeof res === 'object' && res && res.url) ? res.url : (res || `/media/${fileName}`);
    const fotoInput = document.getElementById('p-foto');
    if (fotoInput) {
      fotoInput.value = url;
      updateImgPreview('p-foto', 'p-foto-prev');
    }
  } catch(e) {
    alert("Error al subir foto a la carpeta de la salida: " + e.message);
  } finally {
    if (btn) {
      btn.innerHTML = oldText;
      btn.disabled = false;
    }
    input.value = '';
  }
};

  if (pax.length === 0) return alert('No hay pasajeros registrados.');

  const btn = event.currentTarget;
  const oldText = btn.innerHTML;
  btn.innerHTML = 'Cargando...';
  btn.disabled = true;

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    // Utility to prevent image loads from hanging forever
    const withTimeout = (promise, ms) => {
      let timeoutId;
      const timeoutPromise = new Promise((_, reject) => {
        timeoutId = setTimeout(() => { reject(new Error('Timeout')); }, ms);
      });
      return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timeoutId));
    };

    // Logo institucional para fondos claros (logomjf.png)
    const logoImg = await withTimeout(new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.src = '../assets/img/logomjf.png';
      img.onload = () => resolve(img);
      img.onerror = () => {
        const img2 = new Image();
        img2.crossOrigin = 'Anonymous';
        img2.src = '/assets/img/logomjf.png';
        img2.onload = () => resolve(img2);
        img2.onerror = () => resolve(null);
      };
    }), 4000).catch(() => null);

    // Preload passenger photos
    const photoPs = pax.map(p => {
      if (!p.foto) return Promise.resolve(null);
      return withTimeout(new Promise(resolve => {
        const im = new Image();
        im.crossOrigin = 'Anonymous';
        im.src = p.foto;
        im.onload = () => resolve({url: p.foto, img: im});
        im.onerror = () => resolve(null);
      }), 5000).catch(() => null);
    });

    const loadedPhotos = await Promise.all(photoPs);
    const imgMap = {};
    loadedPhotos.forEach(im => { if(im) imgMap[im.url] = im.img; });

    // --- HEADER ---
    if (logoImg) {
      try {
        doc.addImage(logoImg, 'PNG', 14, 8, 54, 27);
      } catch(e) {
        console.warn('Error adding logo to PDF:', e);
      }
    }

    doc.setFontSize(16);
    doc.setTextColor(15, 23, 42); // slate-900
    doc.text("MANIFIESTO DE PASAJEROS", 196, 25, { align: 'right' });
    
    // --- INFO BLOCK (rediseñado compacto) ---
    doc.setFillColor(245, 251, 250);
    doc.setDrawColor(210, 230, 228);
    doc.roundedRect(14, 40, 182, 23, 2, 2, 'FD');
    doc.setFillColor(13, 148, 136);
    doc.rect(14, 40, 3, 23, 'F');

    doc.setFontSize(9);
    const infoLabelColor = [13, 148, 136]; // teal
    const infoValueColor = [30, 41, 59];   // slate-800

    // Col 1
    doc.setTextColor(...infoLabelColor); doc.setFont(undefined, 'bold');
    doc.text('Tour:', 20, 47);
    doc.setTextColor(...infoValueColor); doc.setFont(undefined, 'normal');
    doc.text(s.tour_nombre || 'No especificado', 32, 47);

    doc.setTextColor(...infoLabelColor); doc.setFont(undefined, 'bold');
    doc.text('Fechas:', 20, 53.5);
    doc.setTextColor(...infoValueColor); doc.setFont(undefined, 'normal');
    doc.text(`${s.fecha_salida || 'TBD'} al ${s.fecha_retorno || 'TBD'}`, 35, 53.5);

    doc.setTextColor(...infoLabelColor); doc.setFont(undefined, 'bold');
    doc.text('Guía:', 20, 60);
    doc.setTextColor(...infoValueColor); doc.setFont(undefined, 'normal');
    doc.text(s.guia_asignado || 'No asignado', 31, 60);

    // Col 2 (derecha)
    doc.setTextColor(...infoLabelColor); doc.setFont(undefined, 'bold');
    doc.text('ID Salida:', 118, 47);
    doc.setTextColor(...infoValueColor); doc.setFont(undefined, 'normal');
    doc.text(s.id || '', 138, 47);

    doc.setTextColor(...infoLabelColor); doc.setFont(undefined, 'bold');
    doc.text('Pasajeros:', 118, 53.5);
    doc.setTextColor(...infoValueColor); doc.setFont(undefined, 'normal');
    doc.text(pax.length.toString(), 138, 53.5);

    const tableData = pax.map((p, i) => {
      let edad = '-';
      if (p.fecha_nacimiento) {
        const birthDate = new Date(p.fecha_nacimiento);
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
          age--;
        }
        edad = age.toString() + ' años';
      }
      return [
        i + 1,
        '', // Foto placeholder
        p.nombre_completo,
        `${p.nacionalidad}\n${edad}`,
        p.pasaporte,
        `${p.restricciones_dieteticas || '-'}\n${p.condiciones_medicas || '-'}`,
        p.whatsapp ? `WA: ${p.whatsapp}` : (p.email ? `E: ${p.email}` : '')
      ];
    });

    // --- MAIN TABLE (compacta y optimizada) ---
    function drawBadge(doc, text, x, y, bgColor, textColor, maxBadgeW = 39) {
      const pad = 1.5;
      doc.setFontSize(6.2);
      const tw = doc.getTextWidth(text);
      const bw = Math.min(tw + pad * 2 + 0.8, maxBadgeW);
      const bh = 4.2;
      doc.setFillColor(...bgColor);
      doc.roundedRect(x, y - bh + 1.0, bw, bh, 1.0, 1.0, 'F');
      doc.setTextColor(...textColor);
      doc.setFont(undefined, 'bold');
      doc.text(text, x + pad + 0.4, y - 0.2, { maxWidth: bw - 1.2 });
      return bw + 1;
    }

    doc.autoTable({
      startY: 67,
      head: [['N°', 'Foto', 'Nombre', 'Nac. / Edad', 'Pasaporte', 'Dieta / Salud', 'Contacto']],
      body: tableData,
      theme: 'plain',
      headStyles: {
        fillColor: [10, 46, 37],   // forest dark green
        textColor: [255, 255, 255],
        fontStyle: 'bold',
        fontSize: 7.5,
        cellPadding: { top: 3, bottom: 3, left: 2.5, right: 2 }
      },
      alternateRowStyles: { fillColor: [247, 251, 250] },
      styles: {
        fontSize: 7.5,
        valign: 'middle',
        cellPadding: { top: 2, bottom: 2, left: 2.5, right: 2 },
        lineColor: [220, 235, 232],
        lineWidth: 0.12,
        textColor: [30, 41, 59]
      },
      columnStyles: {
        0: { cellWidth: 7, halign: 'center', fontStyle: 'bold', textColor: [13, 148, 136] },
        1: { cellWidth: 14, minCellHeight: 13, halign: 'center' },
        2: { cellWidth: 36, fontStyle: 'bold' },
        3: { cellWidth: 26 },
        4: { cellWidth: 20, halign: 'center' },
        5: { cellWidth: 42, minCellHeight: 13 },
        6: { cellWidth: 37 }
      },
      didParseCell: function(data) {
        if (data.section === 'body' && (data.column.index === 5 || data.column.index === 6)) {
          data.cell.styles.textColor = [255, 255, 255];
          data.cell.styles.fontSize = 0.1;
        }
        if (data.section === 'body' && data.row.index % 2 === 0) {
          data.cell.styles.fillColor = [255, 255, 255];
        }
      },
      didDrawCell: function(data) {
        // ── Foto del pasajero ──
        if (data.section === 'body' && data.column.index === 1) {
          const rowData = pax[data.row.index];
          if (rowData && rowData.foto && imgMap[rowData.foto]) {
            const dim = 9.5;
            const x = data.cell.x + (data.cell.width - dim) / 2;
            const y = data.cell.y + (data.cell.height - dim) / 2;
            doc.setDrawColor(13, 148, 136);
            doc.setLineWidth(0.35);
            doc.roundedRect(x - 0.4, y - 0.4, dim + 0.8, dim + 0.8, 0.8, 0.8, 'S');
            doc.addImage(imgMap[rowData.foto], 'JPEG', x, y, dim, dim);
          }
        }

        // ── Badges Dieta / Salud (col 5) ──
        if (data.section === 'body' && data.column.index === 5) {
          const rowData = pax[data.row.index];
          const raw = data.cell.raw || '';
          const parts = raw.split('\n');
          const dieta   = (parts[0] || '').trim();
          const medica  = (parts[1] || '').trim();

          const hasDieta = dieta && dieta !== '-' && dieta.toLowerCase() !== 'ninguna';
          const hasMedica = medica && medica !== '-' && medica.toLowerCase() !== 'ninguna';

          let curX = data.cell.x + 1.5;
          let curY = data.cell.y + (data.cell.height / 2);

          if (!hasDieta && !hasMedica) {
            doc.setFontSize(7);
            doc.setTextColor(180, 190, 185);
            doc.setFont(undefined, 'normal');
            doc.text('—', curX + 3, curY + 1);
          } else {
            if (hasDieta && hasMedica) {
              drawBadge(doc, dieta, curX, curY - 1.6, [251, 191, 36], [120, 53, 15], 39);
              drawBadge(doc, medica, curX, curY + 3.8, [204, 241, 236], [15, 118, 110], 39);
            } else if (hasDieta) {
              drawBadge(doc, dieta, curX, curY + 1.2, [251, 191, 36], [120, 53, 15], 39);
            } else {
              drawBadge(doc, medica, curX, curY + 1.2, [204, 241, 236], [15, 118, 110], 39);
            }
          }
        }

        // ── Contacto con pill de color (col 6) ──
        if (data.section === 'body' && data.column.index === 6) {
          const raw = (data.cell.raw || '').trim();
          if (!raw) return;
          const isWA = raw.startsWith('WA:');
          const isEM = raw.startsWith('E:');
          const numText = raw.replace('WA: ', '').replace('E: ', '');

          const pillH = 4.8;
          const pillW = data.cell.width - 3;
          const pillX = data.cell.x + 1.5;
          const pillY = data.cell.y + (data.cell.height - pillH) / 2;

          if (isWA) {
            doc.setFillColor(220, 252, 231); // green-100
            doc.setDrawColor(134, 239, 172); // green-300
          } else if (isEM) {
            doc.setFillColor(219, 234, 254); // blue-100
            doc.setDrawColor(147, 197, 253); // blue-300
          } else {
            doc.setFillColor(241, 245, 249);
            doc.setDrawColor(203, 213, 225);
          }
          doc.setLineWidth(0.25);
          doc.roundedRect(pillX, pillY, pillW, pillH, 1.2, 1.2, 'FD');

          // Prefix dot
          const dotColor = isWA ? [22, 163, 74] : isEM ? [59, 130, 246] : [100, 116, 139];
          doc.setFillColor(...dotColor);
          doc.circle(pillX + 2.5, pillY + pillH / 2, 0.9, 'F');

          doc.setFontSize(6.3);
          doc.setFont(undefined, 'bold');
          doc.setTextColor(...dotColor);
          doc.text(isWA ? 'WA' : isEM ? 'EM' : '', pillX + 4.2, pillY + pillH / 2 + 0.9);

          doc.setFont(undefined, 'normal');
          doc.setTextColor(30, 41, 59);
          doc.setFontSize(6.7);
          const numX = pillX + (isWA || isEM ? 9.8 : 3);
          doc.text(numText, numX, pillY + pillH / 2 + 0.9, { maxWidth: pillW - 10.5 });
        }
      },
      didDrawPage: function(data) {
        // FOOTER premium
        const pageH = doc.internal.pageSize.height;
        const pageW = doc.internal.pageSize.width;
        // Línea separadora
        doc.setDrawColor(13, 148, 136);
        doc.setLineWidth(0.4);
        doc.line(data.settings.margin.left, pageH - 14, pageW - data.settings.margin.right, pageH - 14);
        doc.setFontSize(7.5);
        doc.setTextColor(100, 120, 115);
        doc.setFont(undefined, 'normal');
        const now = new Date();
        const timestamp = now.toLocaleString('es-PE');
        doc.text(`Generado: ${timestamp}`, data.settings.margin.left, pageH - 9);
        doc.text(
          `Pág. ${doc.internal.getNumberOfPages()}`,
          pageW - data.settings.margin.right,
          pageH - 9,
          { align: 'right' }
        );
      }
    });

    doc.save(`Manifiesto-${s.id}.pdf`);
  } catch(e) {
    console.error(e);
    alert('Error al generar PDF: ' + e.message);
  } finally {
    btn.innerHTML = oldText;
    btn.disabled = false;
  }
};

async function viewDeps() {
  const data=await ghGet('www.manujungleforever.com/data/departures.json');
  cFile='www.manujungleforever.com/data/departures.json'; cSha=data.sha;
  cData=JSON.parse(data.content);
  const sal=cData.salidas||[];
  
  // Ordenar salidas numéricamente descendente (ej. 011, 010, 009)
  sal.sort((a,b) => {
    const numA = parseInt((a.id||'').replace(/\D/g, ''), 10);
    const numB = parseInt((b.id||'').replace(/\D/g, ''), 10);
    const validA = !isNaN(numA) && numA < 1000000 ? numA : 0;
    const validB = !isNaN(numB) && numB < 1000000 ? numB : 0;
    return validB - validA;
  });

  // Auto-cierre de salidas con fechas pasadas
  let modified = false;
  const todayStr = new Date().toISOString().split('T')[0];
  sal.forEach(s => {
    if (s.fecha_salida && s.fecha_salida < todayStr && ['disponible', 'limitado'].includes(s.estado)) {
      s.estado = 'cerrado';
      modified = true;
    }
  });

  if (modified) {
    try {
      const updatedData = await ghPut(cFile, JSON.stringify(cData, null, 2), cSha, 'auto-close: expired departures');
      if (updatedData && updatedData.sha) {
        cSha = updatedData.sha;
      }
    } catch(e) { console.error('Auto-close error', e); }
  }

  
  const activas = sal.filter(s => ['disponible', 'limitado'].includes(s.estado)).length;
  const vendidas = sal.reduce((acc, s) => acc + ((s.plazas_totales||0) - (s.plazas_disponibles||0)), 0);
  
  set(`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <div style="display:flex;align-items:center;"><div class="btn-card-icon card-icon-salidas"><i class="ph ph-calendar"></i></div><div><p class="pt" style="margin-bottom:0">Salidas Programadas</p><p class="ps">Control de cupos, logística y ventas</p></div></div>
      <button class="btn-primary" onclick="editDep(-1)">+ Crear Nueva Salida</button>
    </div>
    
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px;margin-bottom:20px;">
      <div class="esec" style="padding:15px;"><div style="font-size:2rem;font-weight:bold;color:var(--teal)">${activas}</div><div style="font-size:.8rem;color:var(--muted)">Salidas Activas</div></div>
      <div class="esec" style="padding:15px;"><div style="font-size:2rem;font-weight:bold;color:#34d399">${vendidas}</div><div style="font-size:.8rem;color:var(--muted)">Plazas Vendidas Totales</div></div>
      <div class="esec" style="padding:15px;"><div style="font-size:2rem;font-weight:bold;color:var(--gold)">${sal.length}</div><div style="font-size:.8rem;color:var(--muted)">Salidas Históricas</div></div>
    </div>
    
    <div style="display:flex;gap:10px;margin-bottom:20px;align-items:center">
      <input type="text" id="dep-search" placeholder="Buscar por Tour o ID..." style="flex:1;background:rgba(3,8,7,.65);border:1px solid rgba(255,255,255,.1);color:var(--fg);padding:10px;border-radius:8px;outline:none;" onkeyup="filterDeps()">
      <select id="dep-filter-status" style="background:rgba(3,8,7,.65);border:1px solid rgba(255,255,255,.1);color:var(--fg);padding:10px;border-radius:8px;outline:none;" onchange="filterDeps()">
        <option value="">Todos los Estados</option>
        <option value="disponible">Disponible</option>
        <option value="limitado">Limitado</option>
        <option value="completo">Agotado / Completo</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>

    <div class="list-grid" id="dep-list">
      ${sal.map((s,i)=>{
        const sold = (s.plazas_totales||0) - (s.plazas_disponibles||0);
        const pct = s.plazas_totales ? Math.round((sold/s.plazas_totales)*100) : 0;
        let stCls = 'on'; let pColor = '#34d399';
        if (s.estado === 'limitado' || pct >= 75) { stCls = 'warn'; pColor = '#fbbf24'; }
        if (s.estado === 'completo' || pct >= 100) { stCls = 'off'; pColor = '#f87171'; }
        if (s.estado === 'cancelado' || s.estado === 'cerrado') { stCls = 'off'; pColor = '#9ca3af'; }
        
        return `<div class="li dep-card" data-tour="${(s.tour_nombre||'').toLowerCase()}" data-id="${(s.id||'').toLowerCase()}" data-status="${s.estado}" style="flex-direction:row;align-items:stretch">
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
              <div>
                <h3 style="margin-bottom:4px;font-size:1.05rem;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;">
                    <span style="background:var(--teal);color:#020617;padding:3px 10px;border-radius:6px;font-size:0.85rem;font-weight:800;letter-spacing:0.5px;box-shadow:0 2px 8px rgba(45,212,191,0.2);">ID: ${(s.id || '').toUpperCase()}</span>
                    ${s.tour_nombre} 
                    <span class="badge ${stCls}" style="vertical-align:middle;font-size:0.6rem">${s.estado.toUpperCase()}</span>
                  </h3>
                  <span style="font-size:.8rem;color:var(--muted)"><i class="ph ph-calendar"></i> ${s.fecha_salida || 'Sin fecha'} → ${s.fecha_regreso || 'Sin fecha'}</span>
              </div>
              <div style="text-align:right">
                <div style="font-weight:bold;color:var(--gold);font-size:1.1rem">$${s.precio} ${s.moneda||'USD'}</div>
                <div style="font-size:.75rem;color:var(--muted)">por pax</div>
              </div>
            </div>
            
            <div style="margin-bottom:12px">
              <div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:4px;">
                <span>Ocupación: ${sold} / ${s.plazas_totales} (${s.plazas_disponibles} disp.)</span>
                <span>${pct}%</span>
              </div>
              <div style="width:100%;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:${pColor};border-radius:4px"></div>
              </div>
            </div>
            
            <div style="display:flex;gap:15px;font-size:.78rem;color:var(--muted);border-top:1px solid rgba(255,255,255,.06);padding-top:10px">
              <div><span style="color:var(--fg)">Guía:</span> ${s.guia_asignado || 'Sin asignar'}</div>
              <div><span style="color:var(--fg)">Mínimo:</span> ${s.plazas_minimas||2} pax (${sold >= (s.plazas_minimas||2) ? '<span style="color:#34d399">Alcanzado ✓</span>' : '<span style="color:#f87171">Faltan '+( (s.plazas_minimas||2) - sold )+'</span>'})</div>
            </div>
          </div>
          
          <div class="li-actions" style="flex-direction:column;border-left:1px solid rgba(255,255,255,.06);padding-left:15px;margin-left:15px;width:140px;gap:8px;justify-content:center">
            <button class="btn-primary" style="width:100%;justify-content:center;padding:7px 10px;font-size:.85rem" onclick="viewPax(${i})">👥 Pasajeros (${(s.pasajeros||[]).length})</button>
            <button class="btn-secondary" style="width:100%;justify-content:center;padding:7px 10px;font-size:.85rem" onclick="editDep(${i})">✏️ Editar Salida</button>
            <div style="display:flex;gap:5px;width:100%">
              <button class="btn-secondary" style="flex:1;padding:5px;font-size:.9rem;justify-content:center" title="Reducir plaza disponible" onclick="adjPlaza(${i},-1)">-1 Disp.</button>
              <button class="btn-secondary" style="flex:1;padding:5px;font-size:.9rem;justify-content:center" title="Aumentar plaza disponible" onclick="adjPlaza(${i},1)">+1 Disp.</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`);
}

window.editDep = async function(idx) {
  let toursList = [];
  window._toursMap = {};
  try {
    const toursData = await ghGet('www.manujungleforever.com/data/tours.json');
    toursList = JSON.parse(toursData.content).tours || [];
    toursList.forEach(t => {
      if(t.id) window._toursMap[t.id] = t;
      if(t.slug) window._toursMap[t.slug] = t;
    });
  } catch(e) { console.error('Error load tours', e); }

  let newId = '';
  if (idx === -1) {
    let nextNum = 1;
    if (cData && cData.salidas && cData.salidas.length > 0) {
      const existingNums = cData.salidas.map(s => {
        const num = parseInt((s.id||'').replace(/\D/g, ''), 10);
        return (!isNaN(num) && num < 1000000) ? num : 0;
      });
      if (existingNums.length > 0) {
        nextNum = Math.max(...existingNums) + 1;
      }
    }
    newId = `DEP-${String(nextNum).padStart(4, '0')}`;
  }

  const s= idx === -1 ? {tour_id:'', tour_nombre:'', id:newId, fecha_salida:'', fecha_regreso:'', precio:0, moneda:'USD', plazas_totales:8, plazas_minimas:2, plazas_disponibles:8, estado:'disponible', guia_asignado:'', notas:'', pasajeros:[]} : cData.salidas[idx];
  
  set(`
    <button class="back-btn" onclick="route('departures')">← Volver a salidas</button>
    <div class="eform"><div class="esec"><div class="esec-h">Datos de la Salida</div>
      <div class="grow2">
        <div class="ff"><label>Seleccionar Tour Base</label>
          <select id="d-tid" onchange="const t = window._toursMap && (window._toursMap[this.value] || window._toursMap[this.options[this.selectedIndex].value]); if(t) { document.getElementById('d-n').value = t.nombre; if(t.precio_desde) document.getElementById('d-p').value = t.precio_desde; } else { document.getElementById('d-n').value = this.options[this.selectedIndex].text; }">
            <option value="">-- Seleccionar Tour --</option>
            ${toursList.map(t => `<option value="${t.id||t.slug}" ${s.tour_id===(t.id||t.slug)?'selected':''}>${t.nombre}</option>`).join('')}
          </select>
        </div>
        <div class="ff"><label>Nombre del tour (Sobreescribir)</label><input id="d-n" value="${esc(s.tour_nombre)}"></div>
      </div>
      <div class="grow3">
        <div class="ff"><label>ID único</label><input id="d-id" value="${esc(s.id)}"></div>
        <div class="ff"><label>Fecha de salida</label><input type="date" id="d-s" value="${esc(s.fecha_salida)}"></div>
        <div class="ff"><label>Fecha de regreso</label><input type="date" id="d-r" value="${esc(s.fecha_regreso)}"></div>
      </div>
      <div class="grow3">
        <div class="ff"><label>Precio ($ USD)</label><input type="number" id="d-p" value="${s.precio ?? 0}"></div>
        <div class="ff"><label>Plazas totales</label><input type="number" id="d-t" value="${s.plazas_totales ?? s.cupos_totales ?? 8}"></div>
        <div class="ff"><label>Mínimo de pasajeros</label><input type="number" id="d-min" value="${s.plazas_minimas ?? s.cupos_minimos ?? 2}"></div>

function set_DIS(h){ document.getElementById('mc').innerHTML=h; }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseFM(raw) {
  const m=raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m) return {body:raw};
  const fm={};
  m[1].split('\n').forEach(line=>{
    const i=line.indexOf(':');
    if(i<0)return;
    const k=line.slice(0,i).trim();
    const val=line.slice(i+1).trim().replace(/^["']|["']$/g,'');
    fm[k]=val;
  });
  if(fm.publicado!==undefined) fm.publicado=fm.publicado!=='false';
  fm.body=m[2].trim();
  return fm;
}
function buildFM(fm,body) {
  const skip=['body'];
  let out='---\n';
  for(const [k,vv] of Object.entries(fm)){
    if(skip.includes(k))continue;
    const s=String(vv);
    const quoted=s.includes(':')||s.includes('"')||s.includes("'")?`"${s.replace(/"/g,'\\"')}"`:s;
    out+=`${k}: ${quoted}\n`;
  }
  return out+`---\n\n${body}`;
}

  const q = document.getElementById('r-search').value.toLowerCase();
  const t = document.getElementById('r-type').value;
  const f = document.getElementById('r-from').value;
  const to = document.getElementById('r-to').value;
  
  let list = window.currentReclamosData || [];
  
  if (q) {
    list = list.filter(x => 
      (x.codigo_reclamo||'').toLowerCase().includes(q) || 
      (x.nombres||'').toLowerCase().includes(q) || 
      (x.documento||'').includes(q)
    );
  }
  
  if (t !== 'Todos') {
    list = list.filter(x => x.tipo === t);
  }
  
  if (f) {
    const fd = new Date(f);
    list = list.filter(x => new Date(x.fecha.split(' ')[0]) >= fd);
  }
  
  if (to) {
    const td = new Date(to);
    list = list.filter(x => new Date(x.fecha.split(' ')[0]) <= td);
  }
  
  renderReclamosRows(list);
}

function exportReclamos() {
  const list = window.currentReclamosData || [];
  if (!list.length) return alert('No hay datos para exportar.');
  
  let csv = 'Código,Fecha,Cliente,Documento,Teléfono,Correo,Tipo,Estado\n';
  list.forEach(r => {
    csv += `"${r.codigo_reclamo}","${r.fecha}","${r.nombres}","${r.documento}","${r.telefono}","${r.correo}","${r.tipo}","${r.estado}"\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Reclamos_ManuJungle_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function openReclamoModal(id) {
  const r = window.currentReclamosData.find(x => String(x.id) === String(id));
  if (!r) return;
  
  window.currentReclamoId = id;
  
  document.getElementById('mr-title').textContent = `${r.tipo.toUpperCase()} N° ${r.codigo_reclamo}`;
  document.getElementById('mr-subtitle').textContent = `Registrado el: ${r.fecha}`;
  document.getElementById('mr-cliente').textContent = r.nombres;
  document.getElementById('mr-dni').textContent = r.documento;
  document.getElementById('mr-tel').textContent = r.telefono;
  document.getElementById('mr-email').textContent = r.correo;
  document.getElementById('mr-domicilio').textContent = r.domicilio;
  
  document.getElementById('mr-detalle').textContent = r.detalle;
  document.getElementById('mr-pedido').textContent = r.pedido;
  
  if (r.estado === 'Atendido') {
    document.getElementById('mr-respuesta-box').style.display = 'none';
    document.getElementById('mr-atendido-box').style.display = 'block';
    document.getElementById('mr-fecha-res').textContent = r.fecha_respuesta || 'Desconocida';
    document.getElementById('mr-respuesta-texto').textContent = r.detalle_respuesta || '';
    document.getElementById('mr-btn-send').style.display = 'none';
  } else {
    document.getElementById('mr-atendido-box').style.display = 'none';
    document.getElementById('mr-respuesta-box').style.display = 'block';
    document.getElementById('mr-reply').value = '';
    document.getElementById('mr-status').style.display = 'none';
    document.getElementById('mr-btn-send').style.display = 'inline-flex';
    document.getElementById('mr-btn-send').disabled = false;
    document.getElementById('mr-btn-send').innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Enviar Respuesta';
  }
  
  openModal('modal-reclamo');
}

async function submitReclamoReply() {
  const id = window.currentReclamoId;
  const reply = document.getElementById('mr-reply').value.trim();
  const statusDiv = document.getElementById('mr-status');
  const btn = document.getElementById('mr-btn-send');
  
  if (!reply) {
    statusDiv.style.display = 'block';
    statusDiv.style.background = 'rgba(239,68,68,0.1)';
    statusDiv.style.color = 'var(--danger)';
    statusDiv.innerHTML = '⚠️ Debe escribir una respuesta oficial.';
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Enviando...';
  statusDiv.style.display = 'none';
  
  try {
    const r = await fetch('/api/reclamos/' + id + '/responder', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${sessionStorage.getItem('cms_token')}`
      },
      body: JSON.stringify({ detalle_respuesta: reply })
    });
    
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error enviando respuesta');
    
    statusDiv.style.display = 'block';
    statusDiv.style.background = 'rgba(16,185,129,0.1)';
    statusDiv.style.color = 'var(--green)';
    statusDiv.innerHTML = '✅ Respuesta enviada y reclamo actualizado exitosamente.';
    
    setTimeout(() => {
      closeModal('modal-reclamo');
      viewReclamos(); // Recargar vista
    }, 2000);
    
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Enviar Respuesta';
    statusDiv.style.display = 'block';
    statusDiv.style.background = 'rgba(239,68,68,0.1)';
    statusDiv.style.color = 'var(--danger)';
    statusDiv.textContent = `Error: ${e.message}`;
  }
}

window.submitReclamoReply = submitReclamoReply;




window.selectMediaItem = function(idx, el, isModal) {
  if (!isModal) return;
  const parent = el.parentElement;
  if (parent) {
    parent.querySelectorAll('.m-item').forEach(e => e.classList.remove('selected'));
  }
  el.classList.add('selected');
  if (window.currentMediaFiles && window.currentMediaFiles[idx]) {
    window.selectedMediaUrl = window.currentMediaFiles[idx].url;
  }
  const btn = document.getElementById('media-confirm');
  if (btn) btn.disabled = false;
};

window.confirmMediaSelect = function() {
  if (window.selectedMediaUrl && window.mediaSelectCallback) {
    try {
      window.mediaSelectCallback(window.selectedMediaUrl);
    } catch(e) {
      console.error('Error executing media callback:', e);
    }
  }
  closeModal('media-modal');
};

window.openMediaModal = async function(callback) {
  window.mediaSelectCallback = callback;
  window.selectedMediaUrl = null;
  const btn = document.getElementById('media-confirm');
  if (btn) btn.disabled = true;
  openModal('media-modal');
  
  const body = document.getElementById('media-modal-body');
  body.innerHTML = `<div class="loading"><div class="spinner"></div> Cargando galería...</div>`;
  
  try {
    window.currentMediaFiles = await r2GetList();

  } catch(e) {
    body.innerHTML = `<div class="err-msg" style="display:block">❌ ${e.message}</div>`;
  }
};

window.pickImage = function(inputId, previewId) {
  openMediaModal((url) => {
    const inp = document.getElementById(inputId);
    if (inp) inp.value = url;
    updateImgPreview(inputId, previewId);
  });
};

window.updateImgPreview = function(inputId, previewId) {
  const inp = document.getElementById(inputId);
  const prev = document.getElementById(previewId);
  if (!inp || !prev) return;
  if (inp.value && inp.value.trim()) {
    prev.src = inp.value.trim();
    prev.classList.add('show');
  } else {
    prev.classList.remove('show');
  }
  const saveBar = document.getElementById('save-bar');
  if (saveBar && saveFnRef) {
    saveBar.style.display = 'flex';
  }
};

window.deleteBlog = async function(path, sha, name) {
  if (confirm(`¿Estás seguro de eliminar permanentemente el artículo "${name}"?`)) {
    set(`<div class="loading"><div class="spinner"></div> Eliminando artículo...</div>`);
    try {
      await ghDelete(path, sha, `delete post: ${name}`);
      const slug = path.split('/').pop().replace('.md', '');
      try {
        const htmlFile = await ghGet(`www.manujungleforever.com/${slug}/index.html`);
        if (htmlFile && htmlFile.sha) {
          await ghDelete(`www.manujungleforever.com/${slug}/index.html`, htmlFile.sha, `delete post html: ${slug}`);
        }
      } catch(e){}
      
      try {
        const idxData = await ghGet('www.manujungleforever.com/data/posts-index.json');
        let idx = JSON.parse(idxData.content);
        idx.posts = (idx.posts || []).filter(p => p.slug !== slug);
        await ghPut('www.manujungleforever.com/data/posts-index.json', JSON.stringify(idx, null, 2), idxData.sha, `remove from index: ${slug}`);
      } catch(e){}

      await viewBlog();
    } catch(e) {
      alert(`Error al eliminar artículo: ${e.message}`);
      await viewBlog();
    }
  }
};
