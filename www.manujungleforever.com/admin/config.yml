# ─── Configuración de Decap CMS — Hidden Jungle Cusco ─────────────────────────
# Panel de administración completamente en español
# Autenticación: GitHub OAuth via Cloudflare Pages Functions
# ──────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: hiddenjunglecusco/hiddenjunglecusco
  branch: master
  auth_type: pkce
  app_id: Ov23li8l7QLOZbG6OIKt

# Carpeta donde se subirán las imágenes desde el panel
media_folder: "www.hiddenjunglecusco.com/uploads"
public_folder: "/uploads"

# Idioma del panel en español
locale: es

# URL de previsualización del sitio
site_url: https://hiddenjunglecusco-2jc.pages.dev

# ─── Colecciones ──────────────────────────────────────────────────────────────
collections:

  # ── Blog: Artículos ────────────────────────────────────────────────────────
  - name: "blog"
    label: "✍️ Blog – Artículos"
    label_singular: "Artículo"
    folder: "www.hiddenjunglecusco.com/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{titulo}} — {{date}}"
    sortable_fields: ["date", "titulo", "categoria"]
    view_filters:
      - label: "Publicados"
        field: publicado
        pattern: true
      - label: "Borradores"
        field: publicado
        pattern: false
    fields:
      - { label: "Título del artículo", name: "title", widget: "string", hint: "El título aparecerá en el listado del blog y en el navegador." }
      - { label: "Fecha de publicación", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "🐆 Vida Silvestre", value: "Wildlife" }
          - { label: "🌿 Conservación", value: "Conservation" }
          - { label: "♻️ Sostenibilidad", value: "Sustainability" }
          - { label: "🗺️ Parque Manu", value: "Manu Park" }
          - { label: "🧳 Tips de Viaje", value: "Travel Tips" }
      - label: "Ícono de categoría (FontAwesome)"
        name: "categoria_icono"
        widget: "select"
        options:
          - { label: "Binoculares (Wildlife)", value: "fas fa-binoculars" }
          - { label: "Hoja (Conservación)", value: "fas fa-leaf" }
          - { label: "Globo (Sostenibilidad)", value: "fas fa-globe-americas" }
          - { label: "Mapa (Manu)", value: "fas fa-map-marked-alt" }
          - { label: "Montaña (Travel Tips)", value: "fas fa-mountain" }
          - { label: "Maleta", value: "fas fa-suitcase-rolling" }
      - { label: "Imagen de portada", name: "imagen", widget: "image", hint: "Imagen principal del artículo (recomendado: 1200×600px)." }
      - { label: "Texto alternativo de la imagen", name: "imagen_alt", widget: "string" }
      - { label: "Extracto (resumen corto)", name: "extracto", widget: "text", hint: "Aparece en el listado del blog. Máximo 200 caracteres." }
      - { label: "Publicado", name: "publicado", widget: "boolean", default: true }
      - { label: "Contenido del artículo", name: "body", widget: "markdown" }

  # ── Tours ──────────────────────────────────────────────────────────────────
  - name: "tours"
    label: "🌿 Tours"
    label_singular: "Tour"
    files:
      - label: "Todos los Tours"
        name: "tours_data"
        file: "www.hiddenjunglecusco.com/data/tours.json"
        fields:
          - label: "Lista de Tours"
            name: "tours"
            widget: "list"
            label_singular: "Tour"
            summary: "{{fields.nombre}} ({{fields.duracion_dias}} días) — {{fields.estado}}"
            fields:
              - { label: "ID único (sin espacios)", name: "id", widget: "string" }
              - { label: "Slug URL", name: "slug", widget: "string", hint: "Ej: 3-day-wildlife-quest-machu-wasi" }
              - { label: "Nombre del tour", name: "nombre", widget: "string" }
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                options:
                  - { label: "🐆 Wildlife (Vida Silvestre)", value: "wildlife" }
                  - { label: "🚗 Road Trip (Viaje en 4x4)", value: "roadtrip" }
                  - { label: "⛺ Expedición", value: "expedition" }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options:
                  - { label: "✅ Activo (disponible)", value: "activo" }
                  - { label: "⏸️ Pausado (temporalmente no disponible)", value: "pausado" }
                  - { label: "❌ Inactivo (oculto)", value: "inactivo" }
              - { label: "Duración (días)", name: "duracion_dias", widget: "number", min: 1, max: 30 }
              - { label: "Duración (noches)", name: "duracion_noches", widget: "number", min: 0, max: 29 }
              - { label: "Precio desde (USD)", name: "precio_desde", widget: "number", min: 0 }
              - { label: "Moneda", name: "moneda", widget: "string", default: "USD" }
              - { label: "Capacidad mínima (personas)", name: "capacidad_min", widget: "number", min: 1 }
              - { label: "Capacidad máxima (personas)", name: "capacidad_max", widget: "number", min: 1 }
              - label: "Dificultad"
                name: "dificultad"
                widget: "select"
                options:
                  - { label: "Fácil", value: "Fácil" }
                  - { label: "Moderado", value: "Moderado" }
                  - { label: "Difícil", value: "Difícil" }
              - { label: "Temporada disponible", name: "temporada", widget: "string", hint: "Ej: Todo el año / Mayo a Octubre" }
              - { label: "Descripción corta", name: "descripcion_corta", widget: "text", hint: "Resumen de 1-2 oraciones para las tarjetas." }
              - { label: "Descripción completa", name: "descripcion_larga", widget: "markdown" }
              - { label: "Imagen principal (hero)", name: "imagen_hero", widget: "image" }
              - { label: "Texto alternativo de la imagen", name: "imagen_alt", widget: "string" }
              - label: "Galería de fotos del tour"
                name: "galeria"
                widget: "list"
                fields:
                  - { label: "Foto", name: "url", widget: "image" }
                  - { label: "Texto alternativo", name: "alt", widget: "string" }
              - label: "Itinerario (día por día)"
                name: "itinerario"
                widget: "list"
                label_singular: "Día"
                summary: "Día {{fields.dia}}: {{fields.titulo}}"
                fields:
                  - { label: "Número de día", name: "dia", widget: "number", min: 1 }
                  - { label: "Título del día", name: "titulo", widget: "string" }
                  - { label: "Descripción del día", name: "descripcion", widget: "markdown" }
              - label: "¿Qué incluye?"
                name: "incluye"
                widget: "list"
                field: { label: "Item incluido", name: "item", widget: "string" }
              - label: "¿Qué NO incluye?"
                name: "no_incluye"
                widget: "list"
                field: { label: "Item no incluido", name: "item", widget: "string" }
              - { label: "Destacado en la portada", name: "destacado", widget: "boolean", default: false }

  # ── Salidas / Calendario ───────────────────────────────────────────────────
  - name: "salidas"
    label: "📅 Salidas Programadas"
    label_singular: "Salida"
    files:
      - label: "Calendario de Salidas"
        name: "salidas_data"
        file: "www.hiddenjunglecusco.com/data/departures.json"
        fields:
          - label: "Salidas Programadas"
            name: "salidas"
            widget: "list"
            label_singular: "Salida"
            summary: "{{fields.tour_nombre}} — {{fields.fecha_salida}} ({{fields.estado}})"
            fields:
              - { label: "ID único", name: "id", widget: "string", hint: "Ej: dep-011" }
              - { label: "ID del tour (tour_id)", name: "tour_id", widget: "string", hint: "Debe coincidir con el ID del tour en tours.json" }
              - { label: "Nombre del tour", name: "tour_nombre", widget: "string" }
              - { label: "Fecha de salida", name: "fecha_salida", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Fecha de regreso", name: "fecha_regreso", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Precio (USD)", name: "precio", widget: "number", min: 0 }
              - { label: "Moneda", name: "moneda", widget: "string", default: "USD" }
              - { label: "Plazas totales", name: "plazas_totales", widget: "number", min: 1 }
              - { label: "Plazas disponibles", name: "plazas_disponibles", widget: "number", min: 0 }
              - label: "Estado"
                name: "estado"
                widget: "select"
                options:
                  - { label: "✅ Disponible", value: "disponible" }
                  - { label: "⚠️ Plazas Limitadas", value: "limitado" }
                  - { label: "🔴 Completo", value: "completo" }
                  - { label: "❌ Cancelado", value: "cancelado" }
              - { label: "Notas adicionales", name: "notas", widget: "string", required: false }

  # ── Galería de Fotos ────────────────────────────────────────────────────────
  - name: "galeria"
    label: "📸 Galería de Fotos"
    files:
      - label: "Gestionar Galería"
        name: "galeria_data"
        file: "www.hiddenjunglecusco.com/data/gallery.json"
        fields:
          - label: "Fotos de la galería"
            name: "fotos"
            widget: "list"
            label_singular: "Foto"
            summary: "{{fields.alt}} ({{fields.categoria}})"
            fields:
              - { label: "ID único", name: "id", widget: "string" }
              - { label: "Imagen", name: "url", widget: "image" }
              - { label: "Texto alternativo (SEO)", name: "alt", widget: "string" }
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                options:
                  - { label: "🐆 Vida Silvestre", value: "wildlife" }
                  - { label: "🏔️ Paisajes", value: "paisaje" }
                  - { label: "👥 Gente y Cultura", value: "gente" }
                  - { label: "🏕️ Actividades", value: "actividades" }
                  - { label: "🛖 Lodge y Alojamiento", value: "lodge" }
              - { label: "Foto destacada", name: "destacada", widget: "boolean", default: false }
          - label: "Categorías disponibles"
            name: "categorias"
            widget: "list"
            fields:
              - { label: "ID de categoría", name: "id", widget: "string" }
              - { label: "Nombre visible", name: "nombre", widget: "string" }

  # ── Testimonios ────────────────────────────────────────────────────────────
  - name: "testimonios"
    label: "⭐ Testimonios de Clientes"
    files:
      - label: "Gestionar Testimonios"
        name: "testimonios_data"
        file: "www.hiddenjunglecusco.com/data/testimonials.json"
        fields:
          - label: "Testimonios"
            name: "testimonials"
            widget: "list"
            label_singular: "Testimonio"
            summary: "{{fields.nombre}} ({{fields.pais}}) — {{fields.tour}}"
            fields:
              - { label: "ID único", name: "id", widget: "number" }
              - { label: "Nombre del cliente", name: "nombre", widget: "string" }
              - { label: "País de origen", name: "pais", widget: "string" }
              - { label: "Bandera emoji", name: "bandera", widget: "string", hint: "Ej: 🇺🇸 🇬🇧 🇩🇪", required: false }
              - { label: "Tour que realizaron", name: "tour", widget: "string" }
              - { label: "Fecha del viaje", name: "fecha", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - label: "Calificación (estrellas)"
                name: "rating"
                widget: "select"
                options: [5, 4, 3]
              - { label: "Texto del testimonio", name: "texto", widget: "text" }
              - { label: "Foto del cliente (opcional)", name: "foto", widget: "image", required: false }
              - { label: "Activo (visible en el sitio)", name: "activo", widget: "boolean", default: true }

  # ── Página de Inicio ────────────────────────────────────────────────────────
  - name: "paginas"
    label: "📄 Páginas del Sitio"
    files:

      - label: "Página de Inicio"
        name: "home"
        file: "www.hiddenjunglecusco.com/data/home.json"
        fields:
          - label: "Sección Hero (Portada)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto de ubicación", name: "location_tag", widget: "string" }
              - { label: "Título principal", name: "title", widget: "string" }
              - { label: "Título (parte énfasis)", name: "title_emphasis", widget: "string" }
              - { label: "Subtítulo / descripción", name: "subtitle", widget: "text" }
              - { label: "ID del video de YouTube", name: "video_id", widget: "string" }
          - label: "Estadísticas numéricas"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Valor", name: "value", widget: "string", hint: "Ej: 500 o 4.9★" }
              - { label: "Sufijo (opcional)", name: "suffix", widget: "string", required: false, hint: "Ej: +" }
              - { label: "Etiqueta", name: "label", widget: "string" }
              - label: "Tipo"
                name: "type"
                widget: "select"
                options:
                  - { label: "Contador animado", value: "counter" }
                  - { label: "Texto estático", value: "static" }
          - label: "Sección Sobre Nosotros"
            name: "about_section"
            widget: "object"
            fields:
              - { label: "Eyebrow (texto pequeño arriba)", name: "eyebrow", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - label: "Párrafos"
                name: "paragraphs"
                widget: "list"
                field: { label: "Párrafo", name: "text", widget: "text" }
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Texto alternativo", name: "image_alt", widget: "string" }
          - label: "Sección Pilares / Valores"
            name: "pillars_section"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - label: "Pilares"
                name: "pillars"
                widget: "list"
                fields:
                  - { label: "Ícono FontAwesome", name: "icon", widget: "string", hint: "Ej: fas fa-home" }
                  - { label: "Título del pilar", name: "title", widget: "string" }
                  - { label: "Descripción", name: "text", widget: "text" }

      - label: "Página About Us"
        name: "about_page"
        file: "www.hiddenjunglecusco.com/data/about.json"
        fields:
          - { label: "Imagen hero", name: "hero_image", widget: "image" }
          - { label: "Título de la página", name: "titulo_pagina", widget: "string" }
          - { label: "Subtítulo", name: "subtitulo_pagina", widget: "string" }
          - label: "Sección Historia"
            name: "historia"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - label: "Párrafos"
                name: "paragrafos"
                widget: "list"
                field: { label: "Párrafo", name: "text", widget: "text" }
          - label: "Misión"
            name: "mision"
            widget: "object"
            fields:
              - { label: "Título", name: "titulo", widget: "string" }
              - { label: "Texto de la misión", name: "texto", widget: "text" }
          - label: "Equipo"
            name: "equipo"
            widget: "list"
            label_singular: "Miembro del equipo"
            fields:
              - { label: "Nombre", name: "nombre", widget: "string" }
              - { label: "Cargo / Rol", name: "cargo", widget: "string" }
              - { label: "Biografía", name: "bio", widget: "text" }
              - { label: "Foto", name: "foto", widget: "image" }
              - { label: "Especialidad", name: "especialidad", widget: "string" }

      - label: "Página de Contacto"
        name: "contact_page"
        file: "www.hiddenjunglecusco.com/data/contact.json"
        fields:
          - { label: "Título de la página", name: "titulo_pagina", widget: "string" }
          - { label: "Subtítulo", name: "subtitulo_pagina", widget: "string" }
          - label: "Datos de contacto"
            name: "contacto_principal"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Teléfono 1", name: "telefono_1", widget: "string" }
              - { label: "Teléfono 2 (opcional)", name: "telefono_2", widget: "string", required: false }
              - { label: "Número de WhatsApp", name: "whatsapp", widget: "string", hint: "Sin espacios ni símbolos, ej: 51923289231" }
          - label: "Dirección"
            name: "direccion"
            widget: "object"
            fields:
              - { label: "Nombre del lugar", name: "nombre", widget: "string" }
              - { label: "Localidad / Ciudad", name: "localidad", widget: "string" }
              - { label: "País", name: "pais", widget: "string" }
          - label: "Horario de atención"
            name: "horario"
            widget: "object"
            fields:
              - { label: "Días", name: "dias", widget: "string", hint: "Ej: Lunes – Domingo" }
              - { label: "Horas", name: "horas", widget: "string", hint: "Ej: 7:00 AM – 8:00 PM" }
              - { label: "Nota adicional", name: "nota", widget: "string", required: false }

  # ── Configuración Global del Sitio ─────────────────────────────────────────
  - name: "configuracion"
    label: "⚙️ Configuración Global del Sitio"
    files:
      - label: "Datos Generales del Negocio"
        name: "global"
        file: "www.hiddenjunglecusco.com/data/global.json"
        fields:
          - { label: "Nombre del negocio", name: "site_name", widget: "string" }
          - { label: "Eslogan", name: "slogan", widget: "string" }
          - { label: "Tagline (descripción breve)", name: "tagline", widget: "text" }
          - { label: "URL del sitio", name: "url", widget: "string" }
          - { label: "Email de contacto", name: "email", widget: "string" }
          - { label: "Teléfono principal", name: "phone_primary", widget: "string" }
          - { label: "Teléfono secundario", name: "phone_secondary", widget: "string", required: false }
          - { label: "Número de WhatsApp", name: "whatsapp_number", widget: "string", hint: "Sin espacios ej: 51923289231" }
          - { label: "Dirección física", name: "address", widget: "string" }
          - { label: "URL en Google Maps", name: "address_maps_url", widget: "string" }
          - { label: "Logo principal", name: "logo_main", widget: "image" }
          - { label: "Favicon", name: "favicon", widget: "image" }
          - label: "Redes Sociales"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook URL", name: "facebook", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "TripAdvisor URL", name: "tripadvisor", widget: "string" }
              - { label: "Airbnb URL", name: "airbnb", widget: "string", required: false }
              - { label: "WhatsApp URL", name: "whatsapp", widget: "string" }
              - { label: "TikTok URL", name: "tiktok", widget: "string", required: false }
              - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
          - label: "SEO por defecto"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Sufijo del título", name: "default_title_suffix", widget: "string", hint: "Ej: | Hidden Jungle Cusco" }
              - { label: "Descripción por defecto", name: "default_description", widget: "text" }
              - { label: "Imagen OG por defecto", name: "default_og_image", widget: "image" }
