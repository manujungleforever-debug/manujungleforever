<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manu Jungle Forever Admin</title>
    <link rel="icon" type="image/png" href="../assets/img/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { bg1: '#020617', bg2: '#0f172a', accent1: '#38bdf8', accent2: '#7dd3fc' },
                    fontFamily: { sans: ['Poppins', 'sans-serif'], orbitron: ['Orbitron', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: white; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans relative overflow-hidden">
    
    <!-- Decorative background elements -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-accent1/20 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-accent2/10 blur-[100px] rounded-full pointer-events-none"></div>

    <div class="glass-panel w-full max-w-md p-8 md:p-10 rounded-3xl shadow-2xl relative z-10 mx-4 border-accent1/20">
        <div class="flex flex-col items-center mb-8">
            <div class="relative w-24 h-24 mb-4">
                <div class="absolute inset-0 bg-accent1 blur-lg opacity-40 animate-pulse rounded-full"></div>
                <img src="../assets/img/logo.png" alt="Logo" class="w-full h-full object-contain relative z-10 filter drop-shadow-[0_0_10px_rgba(56,189,248,0.5)]">
            </div>
            <h1 class="font-orbitron text-2xl font-bold text-center tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-accent2">MANU JUNGLE CMS</h1>
            <p class="text-gray-400 text-sm mt-1">Acceso Administrativo Seguro</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-400 text-xs uppercase tracking-wider mb-2 font-semibold">Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-gray-500"></i>
                    </div>
                    <input type="email" id="inp-u" required placeholder="admin@manujungleforever.com" class="w-full pl-11 bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-accent1 focus:bg-white/10 transition shadow-inner">
                </div>
            </div>
            
            <div>
                <label class="block text-gray-400 text-xs uppercase tracking-wider mb-2 font-semibold">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-500"></i>
                    </div>
                    <input type="password" id="inp-p" required placeholder="••••••••" class="w-full pl-11 bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-accent1 focus:bg-white/10 transition shadow-inner">
                </div>
            </div>

            <div id="login-err" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-4 py-3 rounded-lg text-center font-medium"></div>

            <button type="submit" id="btn-login" class="w-full mt-6 bg-gradient-to-r from-accent1 to-accent2 hover:from-accent2 hover:to-accent1 text-bg1 font-bold rounded-xl py-3.5 transition-all duration-300 shadow-[0_0_15px_rgba(56,189,248,0.4)] hover:shadow-[0_0_25px_rgba(56,189,248,0.6)] transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('inp-u').value.trim();
            const p = document.getElementById('inp-p').value;
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('login-err');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Autenticando...';
            err.classList.add('hidden');

            try {
                const r = await fetch('/api/cms/login', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({user:u, pass:p})
                });
                const d = await r.json();
                
                if (!r.ok) throw new Error(d.error || 'Credenciales incorrectas');
                
                sessionStorage.setItem('cms_token', d.token);
                sessionStorage.setItem('cms_user', u);
                
                // Redirigir al panel
                window.location.href = 'panel.html';
                
            } catch(e) {
                err.textContent = e.message || 'Error de conexión';
                err.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión';
            }
        });

        // Si ya está logueado, redirigir
        if (sessionStorage.getItem('cms_token')) {
            window.location.href = 'panel.html';
        }
    </script>
</body>
</html>
