<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración – Hidden Jungle Cusco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b1a0f;
      --surface:  #112017;
      --card:     #162a1e;
      --border:   rgba(255,255,255,.08);
      --gold:     #c9a84c;
      --gold-dim: #7a6028;
      --green:    #2e7d52;
      --text:     #e8f0ea;
      --muted:    rgba(232,240,234,.45);
      --danger:   #e05c5c;
      --success:  #4caf82;
      --radius:   12px;
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    /* ── LOGIN ─────────────────────────────────────────────────── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 40% 60%, #1a3d2a 0%, #0b1a0f 65%);
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%; max-width: 400px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
    }
    .login-card .logo {
      text-align: center; margin-bottom: 32px;
    }
    .login-card .logo img { height: 48px; }
    .login-card h1 { font-size: 1.3rem; font-weight: 600; text-align: center; margin-bottom: 4px; }
    .login-card p.sub { font-size: .85rem; color: var(--muted); text-align: center; margin-bottom: 28px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .8rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
    .field input {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: .95rem; font-family: inherit;
      transition: border .2s;
    }
    .field input:focus { outline: none; border-color: var(--gold); }

    .btn-primary {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--gold), #a07830);
      border: none; border-radius: 8px;
      color: #0b1a0f; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: opacity .2s, transform .1s;
      margin-top: 8px;
    }
    .btn-primary:hover { opacity: .9; }
    .btn-primary:active { transform: scale(.98); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      background: rgba(224,92,92,.12);
      border: 1px solid rgba(224,92,92,.3);
      border-radius: 8px; padding: 10px 14px;
      color: var(--danger); font-size: .85rem;
      margin-bottom: 16px; display: none;
    }

    /* ── SHELL ─────────────────────────────────────────────────── */
    #app { display: none; height: 100vh; flex-direction: column; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .95rem; }
    header .brand img { height: 28px; }
    header nav { display: flex; gap: 4px; }
    header nav button {
      background: none; border: none; color: var(--muted);
      padding: 7px 14px; border-radius: 8px;
      cursor: pointer; font-size: .85rem; font-family: inherit;
      transition: background .15s, color .15s;
    }
    header nav button.active, header nav button:hover { background: rgba(255,255,255,.07); color: var(--text); }
    header nav button.active { color: var(--gold); }

    .logout-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 6px 14px;
      border-radius: 8px; cursor: pointer;
      font-size: .8rem; font-family: inherit;
      transition: all .15s;
    }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    main {
      flex: 1; overflow-y: auto; padding: 32px;
    }

    /* ── PANELS ────────────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .panel-header h2 { font-size: 1.4rem; font-weight: 600; }
    .panel-header p { font-size: .85rem; color: var(--muted); margin-top: 2px; }

    /* ── CARDS LIST ────────────────────────────────────────────── */
    .list-grid { display: grid; gap: 12px; }
    .list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      transition: border-color .15s;
    }
    .list-item:hover { border-color: var(--gold-dim); }
    .list-item-info h3 { font-size: .95rem; font-weight: 500; }
    .list-item-info span { font-size: .78rem; color: var(--muted); }
    .btn-edit {
      background: rgba(201,168,76,.1);
      border: 1px solid rgba(201,168,76,.25);
      color: var(--gold); padding: 6px 16px;
      border-radius: 7px; cursor: pointer;
      font-size: .82rem; font-family: inherit;
      transition: background .15s;
    }
    .btn-edit:hover { background: rgba(201,168,76,.2); }

    /* ── EDITOR ────────────────────────────────────────────────── */
    .editor-back {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: .85rem; font-family: inherit;
      margin-bottom: 20px; padding: 0; display: flex; align-items: center; gap: 6px;
      transition: color .15s;
    }
    .editor-back:hover { color: var(--text); }

    .editor-form { max-width: 820px; }
    .form-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px; margin-bottom: 16px;
    }
    .form-section h3 { font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--gold); margin-bottom: 18px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-row.full { grid-template-columns: 1fr; }

    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .form-field input,
    .form-field textarea,
    .form-field select {
      width: 100%; padding: 10px 13px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: .9rem; font-family: inherit;
      transition: border .2s;
    }
    .form-field input:focus,
    .form-field textarea:focus,
    .form-field select:focus { outline: none; border-color: var(--gold); }
    .form-field textarea { min-height: 100px; resize: vertical; }
    .form-field select option { background: var(--surface); }

    .toggle-wrap { display: flex; align-items: center; gap: 10px; }
    .toggle { position: relative; width: 42px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: rgba(255,255,255,.1);
      border-radius: 24px; cursor: pointer;
      transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 18px; height: 18px; left: 3px; top: 3px;
      background: white; border-radius: 50%;
      transition: transform .2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--green); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

    .save-bar {
      position: sticky; bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 32px;
      display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    }
    .btn-save {
      background: linear-gradient(135deg, var(--gold), #a07830);
      border: none; border-radius: 8px;
      color: #0b1a0f; font-weight: 700; font-size: .9rem;
      padding: 10px 28px; cursor: pointer;
      transition: opacity .2s;
    }
    .btn-save:hover { opacity: .88; }
    .btn-save:disabled { opacity: .5; cursor: not-allowed; }
    .save-status { font-size: .85rem; color: var(--muted); }
    .save-status.ok { color: var(--success); }
    .save-status.err { color: var(--danger); }

    /* ── LOADING ───────────────────────────────────────────────── */
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-overlay {
      display: flex; align-items: center; justify-content: center;
      padding: 60px; color: var(--muted); gap: 12px;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">
      <img src="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png" alt="HJC" onerror="this.style.display='none'">
    </div>
    <h1>Panel de Administración</h1>
    <p class="sub">Hidden Jungle Cusco</p>
    <div class="error-msg" id="login-error"></div>
    <div class="field">
      <label>Usuario</label>
      <input type="text" id="inp-user" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="btn-login">Iniciar sesión</button>
  </div>
</div>

<!-- APP SHELL -->
<div id="app">
  <header>
    <div class="brand">
      <img src="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png" alt="" onerror="this.style.display='none'">
      Hidden Jungle CMS
    </div>
    <nav>
      <button data-panel="blog" class="active">✍️ Blog</button>
      <button data-panel="home">🏠 Inicio</button>
      <button data-panel="departures">📅 Salidas</button>
    </nav>
    <button class="logout-btn" id="btn-logout">Cerrar sesión</button>
  </header>

  <main id="main-content">
    <!-- panels injected here -->
  </main>

  <div class="save-bar" id="save-bar" style="display:none">
    <span class="save-status" id="save-status"></span>
    <button class="btn-save" id="btn-save">Guardar cambios</button>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const API = '/api/cms';

// ── STATE ────────────────────────────────────────────────────────────────────
let token = sessionStorage.getItem('cms_token');
let currentPanel = 'blog';
let currentData = null;
let currentFile = null;
let currentSha  = null;

// ── BOOT ─────────────────────────────────────────────────────────────────────
if (token) showApp();

// ── LOGIN ─────────────────────────────────────────────────────────────────────
document.getElementById('inp-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('btn-login').addEventListener('click', doLogin);

async function doLogin() {
  const user = document.getElementById('inp-user').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const btn  = document.getElementById('btn-login');
  const err  = document.getElementById('login-error');

  btn.disabled = true;
  btn.textContent = 'Entrando…';
  err.style.display = 'none';

  try {
    const r = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, pass })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Credenciales incorrectas');
    token = d.token;
    sessionStorage.setItem('cms_token', token);
    showApp();
  } catch(e) {
    err.textContent = e.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
}

document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.removeItem('cms_token');
  token = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
});

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadPanel('blog');
}

// ── NAV ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('header nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('header nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadPanel(btn.dataset.panel);
  });
});

async function loadPanel(name) {
  currentPanel = name;
  hideSaveBar();
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="loading-overlay"><div class="spinner"></div> Cargando…</div>`;

  if (name === 'blog')       await renderBlogList();
  else if (name === 'home')  await renderHomeEditor();
  else if (name === 'departures') await renderDeparturesEditor();
}

// ── GITHUB API HELPERS ───────────────────────────────────────────────────────
async function ghGet(path) {
  const r = await fetch(`${API}/file?path=${encodeURIComponent(path)}`, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  if (r.status === 401) { logout(); throw new Error('Sesión expirada'); }
  if (!r.ok) throw new Error('Error cargando archivo');
  return r.json();
}

async function ghPut(path, content, sha, message) {
  const r = await fetch(`${API}/file`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, content, sha, message })
  });
  if (r.status === 401) { logout(); throw new Error('Sesión expirada'); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Error guardando');
  return d;
}

// ── BLOG ──────────────────────────────────────────────────────────────────────
async function renderBlogList() {
  const main = document.getElementById('main-content');
  try {
    const data = await ghGet('www.hiddenjunglecusco.com/posts');
    const files = data.files || [];
    main.innerHTML = `
      <div class="panel-header">
        <div><h2>✍️ Artículos del Blog</h2><p>${files.length} artículos encontrados</p></div>
      </div>
      <div class="list-grid">
        ${files.map(f => `
          <div class="list-item">
            <div class="list-item-info">
              <h3>${f.name.replace('.md','')}</h3>
              <span>${f.path}</span>
            </div>
            <button class="btn-edit" onclick="editBlogPost('${f.path}','${f.name}')">Editar</button>
          </div>
        `).join('')}
      </div>`;
  } catch(e) {
    main.innerHTML = `<p style="color:var(--danger);padding:20px">${e.message}</p>`;
  }
}

window.editBlogPost = async function(path, name) {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="loading-overlay"><div class="spinner"></div> Cargando artículo…</div>`;
  try {
    const data = await ghGet(path);
    currentFile = path;
    currentSha  = data.sha;

    // Parse frontmatter
    const raw = data.content;
    const fm  = parseFrontmatter(raw);

    main.innerHTML = `
      <button class="editor-back" onclick="loadPanel('blog')">← Volver al listado</button>
      <div class="editor-form">
        <div class="form-section">
          <h3>Información del Artículo</h3>
          <div class="form-row">
            <div class="form-field">
              <label>Título</label>
              <input type="text" id="f-title" value="${esc(fm.title||'')}">
            </div>
            <div class="form-field">
              <label>Fecha</label>
              <input type="date" id="f-date" value="${esc(fm.date||'')}">
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Categoría</label>
              <select id="f-categoria">
                ${['Wildlife','Conservation','Sustainability','Manu Park','Travel Tips'].map(c =>
                  `<option ${fm.categoria===c?'selected':''}>${c}</option>`
                ).join('')}
              </select>
            </div>
            <div class="form-field">
              <label>Publicado</label>
              <div class="toggle-wrap" style="margin-top:8px">
                <label class="toggle">
                  <input type="checkbox" id="f-publicado" ${fm.publicado!==false?'checked':''}>
                  <span class="toggle-slider"></span>
                </label>
                <span id="pub-label">${fm.publicado!==false?'Sí':'No'}</span>
              </div>
            </div>
          </div>
          <div class="form-field">
            <label>Extracto</label>
            <textarea id="f-extracto">${esc(fm.extracto||'')}</textarea>
          </div>
          <div class="form-field">
            <label>Imagen de portada (URL)</label>
            <input type="text" id="f-imagen" value="${esc(fm.imagen||'')}">
          </div>
        </div>
        <div class="form-section">
          <h3>Contenido del Artículo (Markdown)</h3>
          <div class="form-field">
            <textarea id="f-body" style="min-height:320px;font-family:monospace;font-size:.85rem">${esc(fm.body||'')}</textarea>
          </div>
        </div>
      </div>`;

    document.getElementById('f-publicado').addEventListener('change', e => {
      document.getElementById('pub-label').textContent = e.target.checked ? 'Sí' : 'No';
    });

    currentData = fm;
    showSaveBar(() => saveBlogPost(path));
  } catch(e) {
    main.innerHTML = `<p style="color:var(--danger);padding:20px">${e.message}</p>`;
  }
};

async function saveBlogPost(path) {
  const fm = {
    title:      document.getElementById('f-title').value,
    date:       document.getElementById('f-date').value,
    categoria:  document.getElementById('f-categoria').value,
    publicado:  document.getElementById('f-publicado').checked,
    extracto:   document.getElementById('f-extracto').value,
    imagen:     document.getElementById('f-imagen').value,
    ...currentData
  };
  const body = document.getElementById('f-body').value;
  const content = buildFrontmatter(fm, body);
  const result = await ghPut(path, content, currentSha, `update: ${fm.title}`);
  currentSha = result.sha;
}

// ── HOME ──────────────────────────────────────────────────────────────────────
async function renderHomeEditor() {
  const main = document.getElementById('main-content');
  try {
    const data = await ghGet('www.hiddenjunglecusco.com/data/home.json');
    currentFile = 'www.hiddenjunglecusco.com/data/home.json';
    currentSha  = data.sha;
    const d = JSON.parse(data.content);

    main.innerHTML = `
      <div class="panel-header"><div><h2>🏠 Página de Inicio</h2><p>Edita el contenido principal del sitio</p></div></div>
      <div class="editor-form">
        <div class="form-section">
          <h3>Sección Hero (Portada)</h3>
          <div class="form-field"><label>Título principal</label><input id="h-title" value="${esc(d.hero?.title||'')}"></div>
          <div class="form-field"><label>Título énfasis (parte verde)</label><input id="h-emphasis" value="${esc(d.hero?.title_emphasis||'')}"></div>
          <div class="form-field"><label>Subtítulo / descripción</label><textarea id="h-subtitle">${esc(d.hero?.subtitle||'')}</textarea></div>
          <div class="form-row">
            <div class="form-field"><label>Texto de ubicación</label><input id="h-location" value="${esc(d.hero?.location_tag||'')}"></div>
            <div class="form-field"><label>ID del video de YouTube</label><input id="h-video" value="${esc(d.hero?.video_id||'')}"></div>
          </div>
        </div>
        <div class="form-section">
          <h3>Sección Sobre Nosotros</h3>
          <div class="form-field"><label>Título</label><input id="a-title" value="${esc(d.about_section?.title||'')}"></div>
          <div class="form-field"><label>Eyebrow (texto pequeño encima)</label><input id="a-eyebrow" value="${esc(d.about_section?.eyebrow||'')}"></div>
          <div class="form-field"><label>Párrafos (uno por línea)</label>
            <textarea id="a-paragraphs" style="min-height:120px">${(d.about_section?.paragraphs||[]).map(p=>p.text||p).join('\n\n')}</textarea>
          </div>
        </div>
      </div>`;

    currentData = d;
    showSaveBar(() => saveHome(d));
  } catch(e) {
    main.innerHTML = `<p style="color:var(--danger);padding:20px">${e.message}</p>`;
  }
}

async function saveHome(original) {
  const d = { ...original };
  d.hero = {
    ...d.hero,
    title:          document.getElementById('h-title').value,
    title_emphasis: document.getElementById('h-emphasis').value,
    subtitle:       document.getElementById('h-subtitle').value,
    location_tag:   document.getElementById('h-location').value,
    video_id:       document.getElementById('h-video').value,
  };
  const paragraphs = document.getElementById('a-paragraphs').value
    .split(/\n\n+/).map(t => ({ text: t.trim() })).filter(p => p.text);
  d.about_section = { ...d.about_section, title: document.getElementById('a-title').value, eyebrow: document.getElementById('a-eyebrow').value, paragraphs };

  const result = await ghPut(currentFile, JSON.stringify(d, null, 2), currentSha, 'update: home page content');
  currentSha = result.sha;
}

// ── DEPARTURES ───────────────────────────────────────────────────────────────
async function renderDeparturesEditor() {
  const main = document.getElementById('main-content');
  try {
    const data = await ghGet('www.hiddenjunglecusco.com/data/departures.json');
    currentFile = 'www.hiddenjunglecusco.com/data/departures.json';
    currentSha  = data.sha;
    const d = JSON.parse(data.content);
    const salidas = d.salidas || [];

    main.innerHTML = `
      <div class="panel-header">
        <div><h2>📅 Salidas Programadas</h2><p>${salidas.length} salidas registradas</p></div>
      </div>
      <div class="list-grid">
        ${salidas.map((s,i) => `
          <div class="list-item">
            <div class="list-item-info">
              <h3>${s.tour_nombre} — ${s.fecha_salida}</h3>
              <span>ID: ${s.id} | Estado: ${s.estado} | Plazas: ${s.plazas_disponibles}/${s.plazas_totales}</span>
            </div>
            <button class="btn-edit" onclick="editDeparture(${i})">Editar</button>
          </div>`).join('')}
      </div>`;

    currentData = d;
  } catch(e) {
    main.innerHTML = `<p style="color:var(--danger);padding:20px">${e.message}</p>`;
  }
}

// ── SAVE BAR ─────────────────────────────────────────────────────────────────
function showSaveBar(saveFn) {
  const bar = document.getElementById('save-bar');
  const btn = document.getElementById('btn-save');
  const status = document.getElementById('save-status');
  bar.style.display = 'flex';
  status.textContent = '';
  status.className = 'save-status';

  btn.onclick = async () => {
    btn.disabled = true;
    status.textContent = 'Guardando…';
    status.className = 'save-status';
    try {
      await saveFn();
      status.textContent = '✓ Guardado correctamente';
      status.className = 'save-status ok';
    } catch(e) {
      status.textContent = '✗ ' + e.message;
      status.className = 'save-status err';
    } finally {
      btn.disabled = false;
    }
  };
}

function hideSaveBar() {
  document.getElementById('save-bar').style.display = 'none';
}

// ── FRONTMATTER ───────────────────────────────────────────────────────────────
function parseFrontmatter(raw) {
  const match = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if (!match) return { body: raw };
  const fm = {};
  match[1].split('\n').forEach(line => {
    const [k, ...v] = line.split(':');
    if (k) fm[k.trim()] = v.join(':').trim().replace(/^["']|["']$/g,'');
  });
  if (fm.publicado !== undefined) fm.publicado = fm.publicado === 'true';
  fm.body = match[2].trim();
  return fm;
}

function buildFrontmatter(fm, body) {
  const skip = ['body'];
  let out = '---\n';
  for (const [k,v] of Object.entries(fm)) {
    if (skip.includes(k)) continue;
    const val = typeof v === 'string' && (v.includes(':') || v.includes('"')) ? `"${v}"` : v;
    out += `${k}: ${val}\n`;
  }
  out += `---\n\n${body}`;
  return out;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
