<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración – Hidden Jungle Cusco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0b1a0f; --surface:#112017; --card:#162a1e; --border:rgba(255,255,255,.08);
      --gold:#c9a84c; --gold-dim:#7a6028; --green:#2e7d52;
      --text:#e8f0ea; --muted:rgba(232,240,234,.45);
      --danger:#e05c5c; --success:#4caf82; --radius:12px;
    }
    html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
    input,textarea,select,button{font-family:inherit;}

    /* LOGIN */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;
      background:radial-gradient(ellipse at 40% 60%,#1a3d2a 0%,#0b1a0f 65%);}
    .login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;
      padding:48px 40px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.5);}
    .login-card .logo{text-align:center;margin-bottom:32px;}
    .login-card .logo img{height:48px;}
    .login-card h1{font-size:1.3rem;font-weight:600;text-align:center;margin-bottom:4px;}
    .login-card p.sub{font-size:.85rem;color:var(--muted);text-align:center;margin-bottom:28px;}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:.78rem;font-weight:500;color:var(--muted);margin-bottom:6px;
      text-transform:uppercase;letter-spacing:.05em;}
    .field input{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);
      border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;transition:border .2s;}
    .field input:focus{outline:none;border-color:var(--gold);}
    .btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,var(--gold),#a07830);
      border:none;border-radius:8px;color:#0b1a0f;font-weight:700;font-size:1rem;
      cursor:pointer;transition:opacity .2s;margin-top:8px;}
    .btn-primary:hover{opacity:.9;}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
    .error-msg{background:rgba(224,92,92,.12);border:1px solid rgba(224,92,92,.3);
      border-radius:8px;padding:10px 14px;color:var(--danger);font-size:.85rem;
      margin-bottom:16px;display:none;}

    /* APP */
    #app{display:none;height:100vh;flex-direction:column;}
    header{display:flex;align-items:center;gap:0;height:60px;
      background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
    .header-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;
      padding:0 20px;white-space:nowrap;border-right:1px solid var(--border);height:100%;}
    .header-brand img{height:26px;}
    header nav{display:flex;flex:1;overflow-x:auto;padding:0 12px;}
    header nav button{background:none;border:none;color:var(--muted);
      padding:0 14px;height:60px;cursor:pointer;font-size:.82rem;white-space:nowrap;
      border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
    header nav button:hover{color:var(--text);}
    header nav button.active{color:var(--gold);border-bottom-color:var(--gold);}
    .logout-btn{background:none;border:1px solid var(--border);color:var(--muted);
      padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;margin-right:16px;
      white-space:nowrap;transition:all .15s;flex-shrink:0;}
    .logout-btn:hover{border-color:var(--danger);color:var(--danger);}

    /* SIDEBAR LAYOUT */
    .app-body{display:flex;flex:1;overflow:hidden;}
    aside{width:220px;background:var(--surface);border-right:1px solid var(--border);
      overflow-y:auto;flex-shrink:0;padding:16px 0;}
    aside .section-label{font-size:.68rem;font-weight:600;text-transform:uppercase;
      letter-spacing:.08em;color:var(--gold-dim);padding:12px 20px 6px;}
    aside button{display:block;width:100%;text-align:left;background:none;border:none;
      color:var(--muted);padding:9px 20px;cursor:pointer;font-size:.85rem;
      transition:background .15s,color .15s;border-left:2px solid transparent;}
    aside button:hover{background:rgba(255,255,255,.04);color:var(--text);}
    aside button.active{background:rgba(201,168,76,.08);color:var(--gold);
      border-left-color:var(--gold);}

    main{flex:1;overflow-y:auto;padding:28px 32px;}

    /* PANELS */
    .panel-title{font-size:1.3rem;font-weight:600;margin-bottom:4px;}
    .panel-sub{font-size:.82rem;color:var(--muted);margin-bottom:24px;}

    /* LIST */
    .list-grid{display:grid;gap:10px;}
    .list-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
    .list-item:hover{border-color:var(--gold-dim);}
    .list-item h3{font-size:.9rem;font-weight:500;}
    .list-item span{font-size:.75rem;color:var(--muted);}
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:500;
      background:rgba(46,125,82,.2);color:#4caf82;margin-left:8px;}
    .badge.off{background:rgba(224,92,92,.15);color:var(--danger);}

    /* EDITOR */
    .editor-back{background:none;border:none;color:var(--muted);cursor:pointer;
      font-size:.82rem;margin-bottom:20px;padding:0;display:flex;align-items:center;gap:5px;}
    .editor-back:hover{color:var(--text);}
    .editor-form{max-width:860px;}
    .form-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:22px;margin-bottom:14px;}
    .section-h{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
      color:var(--gold);margin-bottom:16px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .form-row.cols3{grid-template-columns:1fr 1fr 1fr;}
    .form-row.full{grid-template-columns:1fr;}
    .form-field{margin-bottom:14px;}
    .form-field label{display:block;font-size:.73rem;font-weight:500;color:var(--muted);
      margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
    .form-field input,.form-field textarea,.form-field select{
      width:100%;padding:9px 12px;background:rgba(255,255,255,.04);
      border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.88rem;transition:border .2s;}
    .form-field input:focus,.form-field textarea:focus,.form-field select:focus{
      outline:none;border-color:var(--gold);}
    .form-field textarea{min-height:90px;resize:vertical;line-height:1.5;}
    .form-field select option{background:var(--surface);}
    .hint{font-size:.7rem;color:var(--muted);margin-top:4px;}

    /* TOGGLE */
    .toggle-wrap{display:flex;align-items:center;gap:10px;padding-top:4px;}
    .toggle{position:relative;width:40px;height:22px;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;}
    .toggle-slider{position:absolute;inset:0;background:rgba(255,255,255,.1);
      border-radius:22px;cursor:pointer;transition:background .2s;}
    .toggle-slider::before{content:'';position:absolute;width:16px;height:16px;
      left:3px;top:3px;background:white;border-radius:50%;transition:transform .2s;}
    .toggle input:checked+.toggle-slider{background:var(--green);}
    .toggle input:checked+.toggle-slider::before{transform:translateX(18px);}

    /* BUTTON ROW */
    .btn-row{display:flex;gap:10px;align-items:center;}
    .btn-edit{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);
      color:var(--gold);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:.8rem;transition:background .15s;}
    .btn-edit:hover{background:rgba(201,168,76,.2);}
    .btn-danger{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.25);
      color:var(--danger);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:.8rem;}

    /* SAVE BAR */
    .save-bar{position:sticky;bottom:0;background:var(--surface);
      border-top:1px solid var(--border);padding:12px 32px;
      display:flex;align-items:center;justify-content:flex-end;gap:12px;}
    .save-status{font-size:.82rem;color:var(--muted);}
    .save-status.ok{color:var(--success);}
    .save-status.err{color:var(--danger);}
    .btn-save{background:linear-gradient(135deg,var(--gold),#a07830);border:none;
      border-radius:8px;color:#0b1a0f;font-weight:700;font-size:.88rem;
      padding:9px 26px;cursor:pointer;transition:opacity .2s;}
    .btn-save:hover{opacity:.88;}
    .btn-save:disabled{opacity:.5;cursor:not-allowed;}

    /* MISC */
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.15);
      border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-state{display:flex;align-items:center;justify-content:center;
      padding:60px;color:var(--muted);gap:10px;}
    .empty-state{text-align:center;padding:60px;color:var(--muted);}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">
      <img src="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png" alt="" onerror="this.style.display='none'">
    </div>
    <h1>Panel de Administración</h1>
    <p class="sub">Hidden Jungle Cusco</p>
    <div class="error-msg" id="login-error"></div>
    <div class="field"><label>Usuario</label><input type="text" id="inp-user" autocomplete="username"></div>
    <div class="field"><label>Contraseña</label><input type="password" id="inp-pass" autocomplete="current-password"></div>
    <button class="btn-primary" id="btn-login">Iniciar sesión</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-brand">
      <img src="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png" alt="" onerror="this.style.display='none'">
      Hidden Jungle CMS
    </div>
    <nav id="top-nav"></nav>
    <button class="logout-btn" id="btn-logout">Cerrar sesión</button>
  </header>
  <div class="app-body">
    <aside id="sidebar"></aside>
    <main id="main-content"></main>
  </div>
  <div class="save-bar" id="save-bar" style="display:none">
    <span class="save-status" id="save-status"></span>
    <button class="btn-save" id="btn-save">Guardar cambios</button>
  </div>
</div>

<script>
const API = '/api/cms';
let token = sessionStorage.getItem('cms_token');
let currentSection = 'blog';
let currentSha = null;
let currentFile = null;
let currentData = null;

// ── NAV STRUCTURE ─────────────────────────────────────────────────────────────
const NAV = [
  { id:'blog',       label:'✍️ Blog',        sub: [] },
  { id:'content',    label:'📄 Contenido',   sub: [
    { id:'home',       label:'🏠 Página de Inicio' },
    { id:'contact',    label:'📞 Contacto' },
    { id:'global',     label:'⚙️ Datos Globales' },
  ]},
  { id:'tours',      label:'🌿 Tours',        sub: [] },
  { id:'departures', label:'📅 Salidas',      sub: [] },
  { id:'testimonials',label:'⭐ Testimonios', sub: [] },
];

// ── BOOT ─────────────────────────────────────────────────────────────────────
if (token) bootApp();
buildNav();

function buildNav() {
  const nav = document.getElementById('top-nav');
  nav.innerHTML = NAV.map(n =>
    `<button data-section="${n.id}" ${n.id===currentSection?'class="active"':''}>${n.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    switchSection(b.dataset.section);
  }));
}

function buildSidebar(items) {
  const aside = document.getElementById('sidebar');
  aside.innerHTML = items.length ? items.map(s =>
    `<button data-sub="${s.id}" ${s.id===currentSection?'class="active"':''}>${s.label}</button>`
  ).join('') : '';
  aside.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    aside.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    loadView(b.dataset.sub);
  }));
}

function switchSection(id) {
  currentSection = id;
  const sec = NAV.find(n=>n.id===id);
  if (sec?.sub?.length) {
    buildSidebar(sec.sub);
    loadView(sec.sub[0].id);
  } else {
    buildSidebar([]);
    loadView(id);
  }
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
document.getElementById('inp-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('btn-login').addEventListener('click', doLogin);

async function doLogin() {
  const user = document.getElementById('inp-user').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'Entrando…'; err.style.display='none';
  try {
    const r = await fetch(`${API}/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user,pass}) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error||'Credenciales incorrectas');
    token = d.token;
    sessionStorage.setItem('cms_token', token);
    bootApp();
  } catch(e) {
    err.textContent = e.message; err.style.display='block';
    btn.disabled=false; btn.textContent='Iniciar sesión';
  }
}

function bootApp() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  switchSection('blog');
}

document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.removeItem('cms_token'); token=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
});

// ── GITHUB HELPERS ────────────────────────────────────────────────────────────
async function ghGet(path) {
  const r = await fetch(`${API}/file?path=${encodeURIComponent(path)}`, {
    headers:{'Authorization':`Bearer ${token}`}
  });
  if (r.status===401) { sessionStorage.removeItem('cms_token'); location.reload(); }
  if (!r.ok) { const e=await r.json().catch(()=>({})); throw new Error(e.error||'Error al cargar'); }
  return r.json();
}

async function ghPut(path, content, sha, msg) {
  const r = await fetch(`${API}/file`, {
    method:'PUT', headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify({path, content, sha, message:msg||`update: ${path}`})
  });
  if (r.status===401) { sessionStorage.removeItem('cms_token'); location.reload(); }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error||'Error al guardar');
  return d;
}

// ── ROUTER ────────────────────────────────────────────────────────────────────
async function loadView(id) {
  hideSaveBar();
  const m = document.getElementById('main-content');
  m.innerHTML = `<div class="loading-state"><div class="spinner"></div> Cargando…</div>`;
  try {
    if      (id==='blog')         await viewBlogList();
    else if (id==='home')         await viewHomeEditor();
    else if (id==='contact')      await viewContactEditor();
    else if (id==='global')       await viewGlobalEditor();
    else if (id==='tours')        await viewToursList();
    else if (id==='departures')   await viewDeparturesList();
    else if (id==='testimonials') await viewTestimonialsList();
  } catch(e) {
    m.innerHTML = `<p style="color:var(--danger);padding:20px">❌ ${e.message}</p>`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// BLOG
// ─────────────────────────────────────────────────────────────────────────────
async function viewBlogList() {
  const data = await ghGet('www.hiddenjunglecusco.com/posts');
  const files = (data.files||[]).filter(f=>f.name.endsWith('.md'));
  set(`
    <p class="panel-title">✍️ Artículos del Blog</p>
    <p class="panel-sub">${files.length} artículos</p>
    <div class="list-grid">
      ${files.map(f=>`
        <div class="list-item">
          <div><h3>${f.name.replace('.md','').replace(/-/g,' ')}</h3><span>${f.name}</span></div>
          <button class="btn-edit" onclick="editBlog('${f.path}')">Editar</button>
        </div>`).join('')}
    </div>`);
}

window.editBlog = async function(path) {
  set(`<div class="loading-state"><div class="spinner"></div></div>`);
  const data = await ghGet(path);
  currentFile=path; currentSha=data.sha;
  const fm = parseFM(data.content);
  set(`
    <button class="editor-back" onclick="viewBlogList()">← Volver al blog</button>
    <div class="editor-form">
      <div class="form-section">
        <div class="section-h">Información</div>
        <div class="form-row">
          <div class="form-field"><label>Título</label><input id="f-title" value="${esc(fm.title||'')}"></div>
          <div class="form-field"><label>Fecha</label><input type="date" id="f-date" value="${esc(fm.date||'')}"></div>
        </div>
        <div class="form-row">
          <div class="form-field"><label>Categoría</label>
            <select id="f-cat">${['Wildlife','Conservation','Sustainability','Manu Park','Travel Tips'].map(c=>`<option ${fm.categoria===c?'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div class="form-field"><label>Publicado</label>
            <div class="toggle-wrap"><label class="toggle"><input type="checkbox" id="f-pub" ${fm.publicado!==false?'checked':''}><span class="toggle-slider"></span></label>
            <span id="pub-lbl">${fm.publicado!==false?'Sí':'No'}</span></div>
          </div>
        </div>
        <div class="form-field"><label>Extracto</label><textarea id="f-extracto">${esc(fm.extracto||'')}</textarea></div>
        <div class="form-field"><label>Imagen de portada (URL o ruta)</label><input id="f-img" value="${esc(fm.imagen||'')}"></div>
        <div class="form-field"><label>Texto alternativo imagen</label><input id="f-imgalt" value="${esc(fm.imagen_alt||'')}"></div>
      </div>
      <div class="form-section">
        <div class="section-h">Contenido (Markdown)</div>
        <div class="form-field"><textarea id="f-body" style="min-height:380px;font-family:monospace;font-size:.82rem;line-height:1.6">${esc(fm.body||'')}</textarea></div>
      </div>
    </div>`);
  document.getElementById('f-pub').addEventListener('change',e=>{
    document.getElementById('pub-lbl').textContent=e.target.checked?'Sí':'No';
  });
  currentData=fm;
  showSaveBar(async()=>{
    const updated={...fm,
      title:v('f-title'),date:v('f-date'),categoria:v('f-cat'),
      publicado:document.getElementById('f-pub').checked,
      extracto:v('f-extracto'),imagen:v('f-img'),imagen_alt:v('f-imgalt')
    };
    const body=v('f-body');
    const content=buildFM(updated,body);
    const res=await ghPut(path,content,currentSha,`update blog: ${updated.title}`);
    currentSha=res.sha;
  });
};

// ─────────────────────────────────────────────────────────────────────────────
// HOME
// ─────────────────────────────────────────────────────────────────────────────
async function viewHomeEditor() {
  const data = await ghGet('www.hiddenjunglecusco.com/data/home.json');
  currentFile='www.hiddenjunglecusco.com/data/home.json'; currentSha=data.sha;
  const d = JSON.parse(data.content);
  set(`
    <p class="panel-title">🏠 Página de Inicio</p>
    <p class="panel-sub">Edita el contenido principal del sitio web</p>
    <div class="editor-form">
      <div class="form-section">
        <div class="section-h">Sección Hero (Portada)</div>
        <div class="form-field"><label>Título principal</label><input id="h-title" value="${esc(d.hero?.title||'')}"></div>
        <div class="form-field"><label>Título énfasis (parte destacada)</label><input id="h-emph" value="${esc(d.hero?.title_emphasis||'')}"></div>
        <div class="form-field"><label>Subtítulo / descripción</label><textarea id="h-sub">${esc(d.hero?.subtitle||'')}</textarea></div>
        <div class="form-row">
          <div class="form-field"><label>Texto de ubicación (ej: Cusco, Perú)</label><input id="h-loc" value="${esc(d.hero?.location_tag||'')}"></div>
          <div class="form-field"><label>ID del video de YouTube</label><input id="h-vid" value="${esc(d.hero?.video_id||'')}"></div>
        </div>
      </div>
      <div class="form-section">
        <div class="section-h">Sección Sobre Nosotros</div>
        <div class="form-row">
          <div class="form-field"><label>Eyebrow (texto pequeño arriba)</label><input id="a-eye" value="${esc(d.about_section?.eyebrow||'')}"></div>
          <div class="form-field"><label>Título</label><input id="a-title" value="${esc(d.about_section?.title||'')}"></div>
        </div>
        <div class="form-field"><label>Párrafos (uno por línea en blanco)</label>
          <textarea id="a-paras" style="min-height:140px">${(d.about_section?.paragraphs||[]).map(p=>p.text||p).join('\n\n')}</textarea>
        </div>
      </div>
      <div class="form-section">
        <div class="section-h">Sección Pilares / Valores</div>
        <div class="form-field"><label>Título de la sección</label><input id="p-title" value="${esc(d.pillars_section?.title||'')}"></div>
        ${(d.pillars_section?.pillars||[]).map((p,i)=>`
          <div style="border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px">
            <div class="form-row cols3">
              <div class="form-field"><label>Ícono (FontAwesome)</label><input id="pi-icon-${i}" value="${esc(p.icon||'')}"></div>
              <div class="form-field"><label>Título</label><input id="pi-title-${i}" value="${esc(p.title||'')}"></div>
              <div class="form-field"><label>Descripción</label><input id="pi-text-${i}" value="${esc(p.text||'')}"></div>
            </div>
          </div>`).join('')}
      </div>
    </div>`);
  currentData=d;
  showSaveBar(async()=>{
    const dd={...d};

// ─────────────────────────────────────────────────────────────────────────────
// SAVE BAR
// ─────────────────────────────────────────────────────────────────────────────
function showSaveBar(fn) {
  const bar=document.getElementById('save-bar');
  const btn=document.getElementById('btn-save');
  const st=document.getElementById('save-status');
  bar.style.display='flex'; st.textContent=''; st.className='save-status';
  btn.onclick=async()=>{
    btn.disabled=true; st.textContent='Guardando…'; st.className='save-status';
    try { await fn(); st.textContent='✓ Guardado'; st.className='save-status ok'; }
    catch(e) { st.textContent='✗ '+e.message; st.className='save-status err'; }
    finally { btn.disabled=false; }
  };
}
function hideSaveBar(){ document.getElementById('save-bar').style.display='none'; }

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function set(html){ document.getElementById('main-content').innerHTML=html; }
function v(id){ return document.getElementById(id)?.value||''; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function parseFM(raw) {
  const m=raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m) return {body:raw};
  const fm={};
  m[1].split('\n').forEach(line=>{
    const [k,...v]=line.split(':');
    if(k) fm[k.trim()]=v.join(':').trim().replace(/^["']|["']$/g,'');
  });
  if(fm.publicado!==undefined) fm.publicado=fm.publicado!=='false'&&fm.publicado!==false;
  fm.body=m[2].trim();
  return fm;
}

function buildFM(fm,body) {
  const skip=['body'];
  let out='---\n';
  for(const [k,vv] of Object.entries(fm)){
    if(skip.includes(k)) continue;
    const val=typeof vv==='string'&&(vv.includes(':')||vv.includes('"'))?`"${vv}"`:vv;
    out+=`${k}: ${val}\n`;
  }
  return out+`---\n\n${body}`;
}
