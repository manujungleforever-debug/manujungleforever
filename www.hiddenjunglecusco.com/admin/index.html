<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración – Hidden Jungle Cusco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0b1a0f;--surface:#112017;--card:#162a1e;--card2:#1c3326;
      --border:rgba(255,255,255,.08);--gold:#c9a84c;--gold-dim:#7a6028;
      --green:#2e7d52;--text:#e8f0ea;--muted:rgba(232,240,234,.45);
      --danger:#e05c5c;--success:#4caf82;--r:12px;
    }
    html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
    input,textarea,select,button{font-family:inherit;}
    a{color:var(--gold);}

    /* ── LOGIN ─────────────────────────────────── */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;
      background:radial-gradient(ellipse at 40% 60%,#1a3d2a 0%,#0b1a0f 65%);}
    .lcard{background:var(--card);border:1px solid var(--border);border-radius:20px;
      padding:48px 40px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.5);}
    .lcard .logo{text-align:center;margin-bottom:32px;}
    .lcard .logo img{height:48px;}
    .lcard h1{font-size:1.3rem;font-weight:600;text-align:center;margin-bottom:4px;}
    .lcard p.sub{font-size:.85rem;color:var(--muted);text-align:center;margin-bottom:28px;}
    .err-msg{background:rgba(224,92,92,.12);border:1px solid rgba(224,92,92,.3);
      border-radius:8px;padding:10px 14px;color:var(--danger);font-size:.85rem;
      margin-bottom:16px;display:none;}

    /* ── APP SHELL ─────────────────────────────── */
    #app{display:none;height:100vh;flex-direction:column;}
    header{display:flex;align-items:center;height:58px;background:var(--surface);
      border-bottom:1px solid var(--border);flex-shrink:0;gap:0;}
    .hbrand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.88rem;
      padding:0 18px;white-space:nowrap;border-right:1px solid var(--border);height:100%;flex-shrink:0;}
    .hbrand img{height:24px;}
    header nav{display:flex;flex:1;overflow-x:auto;padding:0 8px;}
    header nav button{background:none;border:none;color:var(--muted);padding:0 13px;height:58px;
      cursor:pointer;font-size:.82rem;white-space:nowrap;
      border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
    header nav button:hover{color:var(--text);}
    header nav button.active{color:var(--gold);border-bottom-color:var(--gold);}
    .hright{display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0;}
    .huser{font-size:.78rem;color:var(--muted);}
    .btn-logout{background:none;border:1px solid var(--border);color:var(--muted);
      padding:5px 12px;border-radius:7px;cursor:pointer;font-size:.78rem;transition:all .15s;}
    .btn-logout:hover{border-color:var(--danger);color:var(--danger);}

    .app-body{display:flex;flex:1;overflow:hidden;}
    aside{width:210px;background:var(--surface);border-right:1px solid var(--border);
      overflow-y:auto;flex-shrink:0;padding:12px 0;}
    aside .slabel{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
      color:var(--gold-dim);padding:14px 18px 5px;}
    aside button{display:block;width:100%;text-align:left;background:none;border:none;
      color:var(--muted);padding:9px 18px;cursor:pointer;font-size:.83rem;
      border-left:2px solid transparent;transition:all .15s;}
    aside button:hover{background:rgba(255,255,255,.04);color:var(--text);}
    aside button.active{background:rgba(201,168,76,.08);color:var(--gold);border-left-color:var(--gold);}

    main{flex:1;overflow-y:auto;padding:24px 28px 80px;}

    /* ── COMMON ────────────────────────────────── */
    .pt{font-size:1.25rem;font-weight:600;margin-bottom:3px;}
    .ps{font-size:.8rem;color:var(--muted);margin-bottom:20px;}

    .btn-primary{background:linear-gradient(135deg,var(--gold),#a07830);border:none;
      border-radius:8px;color:#0b1a0f;font-weight:700;font-size:.88rem;
      padding:9px 20px;cursor:pointer;transition:opacity .2s;display:inline-flex;align-items:center;gap:6px;}
    .btn-primary:hover{opacity:.88;}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
    .btn-secondary{background:rgba(255,255,255,.06);border:1px solid var(--border);
      color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
    .btn-secondary:hover{background:rgba(255,255,255,.1);}
    .btn-danger{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);
      color:var(--danger);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.8rem;transition:all .15s;}
    .btn-danger:hover{background:rgba(224,92,92,.2);}
    .btn-edit{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.25);
      color:var(--gold);padding:6px 14px;border-radius:7px;cursor:pointer;font-size:.8rem;transition:all .15s;}
    .btn-edit:hover{background:rgba(201,168,76,.2);}

    /* ── LISTS ─────────────────────────────────── */
    .list-grid{display:grid;gap:8px;}
    .li{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      padding:13px 16px;display:flex;align-items:center;justify-content:space-between;
      transition:border-color .15s;}
    .li:hover{border-color:var(--gold-dim);}
    .li-info h3{font-size:.9rem;font-weight:500;line-height:1.3;}
    .li-info span{font-size:.74rem;color:var(--muted);display:block;margin-top:2px;}
    .li-actions{display:flex;gap:6px;flex-shrink:0;margin-left:12px;}
    .badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:.7rem;font-weight:600;margin-left:6px;}
    .badge.on{background:rgba(46,125,82,.2);color:var(--success);}
    .badge.off{background:rgba(224,92,92,.15);color:var(--danger);}
    .badge.warn{background:rgba(201,168,76,.15);color:var(--gold);}

    /* ── EDITOR ────────────────────────────────── */
    .back-btn{background:none;border:none;color:var(--muted);cursor:pointer;
      font-size:.82rem;margin-bottom:18px;padding:0;display:flex;align-items:center;gap:5px;transition:color .15s;}
    .back-btn:hover{color:var(--text);}
    .eform{max-width:900px;}
    .esec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
      padding:20px;margin-bottom:12px;}
    .esec-h{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
      color:var(--gold);margin-bottom:14px;}
    .grow2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .grow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
    .ff{margin-bottom:12px;}
    .ff label{display:block;font-size:.71rem;font-weight:500;color:var(--muted);
      margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
    .ff input,.ff textarea,.ff select{
      width:100%;padding:8px 11px;background:rgba(255,255,255,.04);
      border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.88rem;transition:border .2s;}
    .ff input:focus,.ff textarea:focus,.ff select:focus{outline:none;border-color:var(--gold);}
    .ff textarea{resize:vertical;line-height:1.5;}
    .ff select option{background:var(--surface);}
    .hint{font-size:.69rem;color:var(--muted);margin-top:3px;}

    /* ── IMAGE FIELD ───────────────────────────── */
    .img-field-wrap{display:flex;flex-direction:column;gap:8px;}
    .img-input-row{display:flex;gap:8px;}
    .img-input-row input{flex:1;}
    .img-preview{width:100%;max-height:180px;object-fit:cover;border-radius:8px;
      border:1px solid var(--border);display:none;}
    .img-preview.show{display:block;}

    /* ── TOGGLE ────────────────────────────────── */
    .tgl-wrap{display:flex;align-items:center;gap:10px;padding-top:2px;}
    .tgl{position:relative;width:38px;height:21px;flex-shrink:0;}
    .tgl input{opacity:0;width:0;height:0;}
    .tgl-s{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:21px;cursor:pointer;transition:background .2s;}
    .tgl-s::before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;
      background:white;border-radius:50%;transition:transform .2s;}
    .tgl input:checked+.tgl-s{background:var(--green);}
    .tgl input:checked+.tgl-s::before{transform:translateX(17px);}

    /* ── MARKDOWN TOOLBAR ──────────────────────── */
    .md-wrap{border:1px solid var(--border);border-radius:7px;overflow:hidden;}
    .md-toolbar{display:flex;gap:1px;padding:6px 8px;background:rgba(255,255,255,.03);
      border-bottom:1px solid var(--border);flex-wrap:wrap;}
    .md-toolbar button{background:none;border:1px solid transparent;color:var(--muted);
      padding:3px 9px;border-radius:5px;cursor:pointer;font-size:.78rem;transition:all .15s;}
    .md-toolbar button:hover{background:rgba(255,255,255,.08);color:var(--text);border-color:var(--border);}
    .md-wrap textarea{border:none;border-radius:0;background:rgba(255,255,255,.03);}
    .md-wrap textarea:focus{border:none;outline:none;}

    /* ── MEDIA GALLERY ─────────────────────────── */
    .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:16px;}
    .m-item{position:relative;background:var(--surface);border:2px solid transparent;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:1;transition:border .15s;}
    .m-item:hover{border-color:rgba(201,168,76,.5);}
    .m-item.selected{border-color:var(--gold);}
    .m-item img,.m-item video{width:100%;height:100%;object-fit:cover;display:block;}
    .m-item .m-name{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:white;font-size:.7rem;padding:4px 6px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;}
    .m-item .btn-del{position:absolute;top:4px;right:4px;background:rgba(224,92,92,.9);color:white;border:none;border-radius:4px;width:24px;height:24px;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:.8rem;}
    .m-item:hover .btn-del{display:flex;}

    /* ── SAVE BAR ──────────────────────────────── */
    .save-bar{position:fixed;bottom:0;left:210px;right:0;background:var(--surface);
      border-top:1px solid var(--border);padding:10px 28px;
      display:flex;align-items:center;justify-content:flex-end;gap:10px;
      z-index:100;transition:left .2s;}
    .save-status{font-size:.82rem;color:var(--muted);}
    .save-status.ok{color:var(--success);}
    .save-status.err{color:var(--danger);}

    /* ── MODAL ─────────────────────────────────── */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;
      align-items:center;justify-content:center;z-index:200;display:none;padding:20px;}
    .modal-bg.open{display:flex;}
    .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:28px;width:100%;max-width:500px;box-shadow:0 24px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:100%;}
    .modal.lg{max-width:900px;height:90vh;}
    .modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
    .modal-h h3{font-size:1.1rem;font-weight:600;}
    .modal-body{flex:1;overflow-y:auto;min-height:0;padding-right:4px;}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}

    /* ── MISC ──────────────────────────────────── */
    .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.15);
      border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--muted);gap:10px;}
    .empty{text-align:center;padding:60px;color:var(--muted);}
    .sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
    .tag{display:inline-block;background:rgba(201,168,76,.12);color:var(--gold);
      font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:500;}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lcard">
    <div class="logo"><img src="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png" alt="" onerror="this.style.display='none'"></div>
    <h1>Panel de Administración</h1>
    <p class="sub">Hidden Jungle Cusco</p>
    <div class="err-msg" id="login-err"></div>
    <div class="ff"><label>Usuario</label><input type="text" id="inp-u" autocomplete="username"></div>
    <div class="ff"><label>Contraseña</label><input type="password" id="inp-p" autocomplete="current-password"></div>
    <button class="btn-primary" id="btn-login" style="width:100%;padding:12px;margin-top:4px">Iniciar sesión</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hbrand">
      <img src="../wp-content/uploads/2018/01/cropped-HJC_Logo_PlainSeal_2Color-32x32.png" alt="" onerror="this.style.display='none'">
      Hidden Jungle CMS
    </div>
    <nav id="top-nav"></nav>
    <div class="hright">
      <span class="huser" id="huser"></span>
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </header>
  <div class="app-body">
    <aside id="sidebar"></aside>
    <main id="mc"></main>
  </div>
  <div class="save-bar" id="save-bar" style="display:none">
    <span class="save-status" id="save-status"></span>
    <button class="btn-secondary" id="btn-cancel-save">Cancelar</button>
    <button class="btn-primary" id="btn-save">💾 Guardar cambios</button>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-bg" id="del-modal">
  <div class="modal">
    <div class="modal-h"><h3 id="del-title">¿Eliminar este elemento?</h3></div>
    <div class="modal-body">
      <p style="font-size:.85rem;color:var(--muted)" id="del-msg">Esta acción no se puede deshacer.</p>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('del-modal')">Cancelar</button>
      <button class="btn-danger" id="del-confirm">Sí, eliminar</button>
    </div>
  </div>
</div>

<!-- MEDIA PICKER MODAL -->
<div class="modal-bg" id="media-modal">
  <div class="modal lg">
    <div class="modal-h">
      <h3>🖼️ Seleccionar Medio</h3>
      <div style="display:flex;gap:8px;">
        <button class="btn-primary" onclick="document.getElementById('media-upload').click()">📁 Archivo(s)</button>
        <button class="btn-secondary" onclick="document.getElementById('media-upload-folder').click()">📂 Carpeta</button>
      </div>
      <input type="file" id="media-upload" accept="image/*,video/*" multiple style="display:none">
      <input type="file" id="media-upload-folder" accept="image/*,video/*" webkitdirectory directory style="display:none">
    </div>
    <div class="modal-body" id="media-modal-body">
      <div class="loading"><div class="spinner"></div> Cargando galería...</div>
    </div>
    <div class="modal-actions">
      <span id="media-upload-prog" style="align-self:center;margin-right:auto;font-size:.8rem;color:var(--muted);"></span>
      <button class="btn-secondary" onclick="closeModal('media-modal')">Cancelar</button>
      <button class="btn-primary" id="media-confirm" disabled>Insertar</button>
    </div>
  </div>
</div>

<script>
const API = '/api/cms';
const MEDIA_API = '/api/media';
let token = sessionStorage.getItem('cms_token');
let cUser = sessionStorage.getItem('cms_user') || 'admin';
let cSection = 'blog', cSha = null, cFile = null, cData = null;
let saveFnRef = null;

// ─────────────────────────────────────────────────────────────────────────────
// NAV
// ─────────────────────────────────────────────────────────────────────────────
const SECTIONS = [
  { id:'blog',    label:'✍️ Blog',       sub:[] },
  { id:'content', label:'📄 Contenido',  sub:[
    {id:'home',    label:'🏠 Inicio'},
    {id:'contact', label:'📞 Contacto'},
    {id:'global',  label:'⚙️ Datos Globales'},
  ]},
  { id:'tours',        label:'🌿 Tours',       sub:[] },
  { id:'departures',   label:'📅 Salidas',     sub:[] },
  { id:'testimonials', label:'⭐ Testimonios', sub:[] },
  { id:'media',        label:'🖼️ Medios',      sub:[] }
];

function buildTopNav() {
  const nav = document.getElementById('top-nav');
  nav.innerHTML = SECTIONS.map(s =>
    `<button data-s="${s.id}">${s.label}</button>`
  ).join('');
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    switchSection(b.dataset.s);
  }));
  nav.querySelector(`[data-s="${cSection}"]`)?.classList.add('active');
}

function buildSidebar(items) {
  const aside = document.getElementById('sidebar');
  aside.innerHTML = items.map(s =>
    `<button data-sub="${s.id}">${s.label}</button>`
  ).join('');
  aside.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    aside.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    route(b.dataset.sub);
  }));
}

function switchSection(id) {
  cSection = id;
  hideSaveBar();
  const sec = SECTIONS.find(s=>s.id===id);
  if (sec?.sub?.length) {
    buildSidebar(sec.sub);
    document.getElementById('sidebar').querySelector('button')?.classList.add('active');
    route(sec.sub[0].id);
  } else {
    buildSidebar([]);
    route(id);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// LOGIN / LOGOUT
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('inp-p').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('btn-login').addEventListener('click', doLogin);

async function doLogin() {
  const u = document.getElementById('inp-u').value.trim();
  const p = document.getElementById('inp-p').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('login-err');
  btn.disabled=true; btn.textContent='Entrando…'; err.style.display='none';
  try {
    const r = await fetch(`${API}/login`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error||'Credenciales incorrectas');
    token=d.token; cUser=u;
    sessionStorage.setItem('cms_token',token);
    sessionStorage.setItem('cms_user',u);
    bootApp();
  } catch(e) {
    err.textContent=e.message; err.style.display='block';
    btn.disabled=false; btn.textContent='Iniciar sesión';
  }
}

function bootApp() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('huser').textContent=cUser;
  buildTopNav();
  switchSection('blog');
}

document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.clear(); token=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
});

if (token) bootApp();

// ─────────────────────────────────────────────────────────────────────────────
// API WRAPPERS (GITHUB & R2)
// ─────────────────────────────────────────────────────────────────────────────
async function ghGet(path) {
  const r = await fetch(`${API}/file?path=${encodeURIComponent(path)}`,{headers:{Authorization:`Bearer ${token}`}});
  if (r.status===401){sessionStorage.clear();location.reload();}
  if (!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'Error al cargar');}
  return r.json();
}

async function ghPut(path, content, sha, msg) {
  const r = await fetch(`${API}/file`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify({path,content,sha,message:msg||`update: ${path}`})});
  if (r.status===401){sessionStorage.clear();location.reload();}
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error al guardar');
  return d;
}

async function ghDelete(path, sha, msg) {
  const r = await fetch(`${API}/file`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
    body:JSON.stringify({path,sha,message:msg||`delete: ${path}`})});
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error al eliminar');
  return d;
}

// R2 Media API
async function r2GetList() {
  const r = await fetch(`${MEDIA_API}/index`,{headers:{Authorization:`Bearer ${token}`}});
  if (r.status===401){sessionStorage.clear();location.reload();}
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error al cargar galería');
  return d.files || [];
}

async function r2Upload(file, progressEl) {
  if (progressEl) progressEl.textContent = 'Codificando...';
  const base64 = await fileToBase64(file);
  
  if (progressEl) progressEl.textContent = 'Subiendo a R2...';
  const r = await fetch(`${MEDIA_API}/index`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: file.name, base64, contentType: file.type })
  });
  if (r.status===401){sessionStorage.clear();location.reload();}
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error subiendo archivo');
  
  if (progressEl) { progressEl.textContent = '✓ Completado'; setTimeout(()=>progressEl.textContent='', 2000); }
  return d.file;
}

async function r2Delete(key) {
  const r = await fetch(`${MEDIA_API}/${encodeURIComponent(key)}`, {
    method: 'DELETE', headers: { Authorization: `Bearer ${token}` }
  });
  const d=await r.json(); if(!r.ok)throw new Error(d.error||'Error eliminando archivo');
  return true;
}

let mediaSelectCallback = null;
let currentMediaFiles = [];
let selectedMediaUrl = null;

async function openMediaModal(callback) {
  mediaSelectCallback = callback;
  selectedMediaUrl = null;
  document.getElementById('media-confirm').disabled = true;
  document.getElementById('media-modal').classList.add('open');
  
  const body = document.getElementById('media-modal-body');
  body.innerHTML = `<div class="loading"><div class="spinner"></div> Cargando galería...</div>`;
  
  try {
    currentMediaFiles = await r2GetList();
    renderMediaGrid(body, currentMediaFiles, true);
  } catch(e) {
    body.innerHTML = `<div class="err-msg" style="display:block">❌ ${e.message}</div>`;
  }
}

function renderMediaGrid(container, files, isModal) {
  if (!files.length) {
    container.innerHTML = `<div class="empty">La galería está vacía.</div>`;
    return;
  }
  
  container.innerHTML = `<div class="media-grid">
    ${files.map((f, i) => {
      const isVideo = f.key.match(/\.(mp4|webm)$/i);
      return `
      <div class="m-item" onclick="selectMediaItem(${i}, this, ${isModal})">
        ${isVideo 
          ? `<video src="${f.url}" preload="metadata"></video>` 
          : `<img src="${f.url}" loading="lazy" alt="${f.key}">`}
        <div class="m-name">${f.key}</div>
        ${!isModal ? `<button class="btn-del" onclick="event.stopPropagation(); deleteMedia('${f.key}')">×</button>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function selectMediaItem(idx, el, isModal) {
  if (!isModal) return; // Solo selección en modal
  const parent = el.parentElement;
  parent.querySelectorAll('.m-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedMediaUrl = currentMediaFiles[idx].url;
  document.getElementById('media-confirm').disabled = false;
}

document.getElementById('media-confirm').onclick = () => {
  if (selectedMediaUrl && mediaSelectCallback) {
    mediaSelectCallback(selectedMediaUrl);
  }
  closeModal('media-modal');
};

async function handleMediaUploadEvent(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  e.target.value = '';
  
  const progEl = document.getElementById('media-upload-prog');
  const body = document.getElementById('media-modal-body');
  
  let successCount = 0, errorCount = 0;
  
  for (let i=0; i<files.length; i++) {
    const file = files[i];
    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) continue;
    try {
      if (progEl) progEl.textContent = `Subiendo ${i+1}/${files.length}... (${file.name})`;
      await r2Upload(file, null);
      successCount++;
    } catch(err) {
      console.error(err); errorCount++;
    }
  }
  
  if (progEl) {
     progEl.textContent = `✓ Subidos: ${successCount}` + (errorCount ? `, ✗ Errores: ${errorCount}` : '');
     setTimeout(()=> { if(progEl) progEl.textContent=''; }, 4000);
  }
  
  if (document.getElementById('media-modal').classList.contains('open')) {
    body.innerHTML = `<div class="loading"><div class="spinner"></div> Actualizando...</div>`;
    currentMediaFiles = await r2GetList();
    renderMediaGrid(body, currentMediaFiles, true);
  } else {
    route('media'); // Si está en la vista principal
  }
}

document.getElementById('media-upload').addEventListener('change', handleMediaUploadEvent);
document.getElementById('media-upload-folder').addEventListener('change', handleMediaUploadEvent);

function pickImage(inputId, previewId) {
  openMediaModal((url) => {
    const inp = document.getElementById(inputId);
    if (inp) inp.value = url;
    updateImgPreview(inputId, previewId);
  });
}

function fileToBase64(file) {
  return new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function updateImgPreview(inputId, previewId) {
  const val = document.getElementById(inputId)?.value;
  const prev = document.getElementById(previewId);
  if (!prev) return;
  if (val) { prev.src=val; prev.classList.add('show'); }
  else { prev.classList.remove('show'); }
}

function imgWidget(id, label, value='', hint='') {
  const pid=id+'-prev';
  return `<div class="ff"><label>${label}</label>
    <div class="img-field-wrap">
      <div class="img-input-row">
        <input id="${id}" value="${esc(value)}" placeholder="URL o ruta de imagen" oninput="updateImgPreview('${id}','${pid}')">
        <button type="button" class="btn-secondary" onclick="pickImage('${id}','${pid}')">🖼️ Seleccionar</button>
      </div>
      ${value ? `<img class="img-preview show" id="${pid}" src="${esc(value)}" alt="">` : `<img class="img-preview" id="${pid}" alt="">`}
      ${hint?`<span class="hint">${hint}</span>`:''}
    </div></div>`;
}

// MARKDOWN EDITOR TOOLBAR
// ─────────────────────────────────────────────────────────────────────────────
function mdToolbar(textareaId) {
  const cmds = [
    ['**B**','**','**'],['*I*','*','*'],['~~S~~','~~','~~'],
    ['# H1','# ',''],['## H2','## ',''],['### H3','### ',''],
    ['🔗 Link','[','](url)'],['> Cita','> ',''],['- Lista','- ',''],
    ['1. Lista','1. ',''],['```Código','```\n','\n```'],
  ];
  return `<div class="md-wrap">
    <div class="md-toolbar">${cmds.map(([l,b,a])=>`<button type="button" onclick="mdWrap('${textareaId}','${b.replace(/\n/g,'\\n').replace(/'/g,"\\'")}','${a.replace(/\n/g,'\\n').replace(/'/g,"\\'")}')" title="${l}">${l}</button>`).join('')}</div>
    <textarea id="${textareaId}" style="min-height:320px;font-family:monospace;font-size:.83rem;line-height:1.6;border:none;border-radius:0;background:rgba(255,255,255,.03);padding:12px"></textarea>
  </div>`;
}

function mdWrap(id, before, after) {
  const ta = document.getElementById(id);
  if (!ta) return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  const sel=ta.value.substring(s,e);
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.focus(); ta.selectionStart=s+before.length; ta.selectionEnd=s+before.length+sel.length;
}

// ─────────────────────────────────────────────────────────────────────────────
function confirmDelete(path, sha, label, backFn) {
  document.getElementById('del-title').textContent=`¿Eliminar este ${label}?`;
  document.getElementById('del-msg').textContent=`"${path.split('/').pop()}" — Esta acción no se puede deshacer.`;
  document.getElementById('del-modal').classList.add('open');
  document.getElementById('del-confirm').onclick = async () => {
    try {
      await ghDelete(path,sha,`delete: ${path}`);
      closeModal('del-modal');
      eval(backFn+'()');
    } catch(e) { alert('Error: '+e.message); }
  };
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
window.confirmDelete=confirmDelete; window.closeModal=closeModal;

// ─────────────────────────────────────────────────────────────────────────────
// SAVE BAR
// ─────────────────────────────────────────────────────────────────────────────
function showSaveBar(fn) {
  saveFnRef=fn;
  const bar=document.getElementById('save-bar');
  const btn=document.getElementById('btn-save');
  const st=document.getElementById('save-status');
  bar.style.display='flex'; st.textContent=''; st.className='save-status';
  btn.onclick=async()=>{
    btn.disabled=true; st.textContent='Guardando…'; st.className='save-status';
    try { await fn(); st.textContent='✓ Guardado correctamente'; st.className='save-status ok'; }
    catch(e) { st.textContent='✗ '+e.message; st.className='save-status err'; }
    finally { btn.disabled=false; }
  };
  document.getElementById('btn-cancel-save').onclick=()=>{
    if(confirm('¿Descartar cambios?')){ hideSaveBar(); route(cSection); }
  };
}
function hideSaveBar() { document.getElementById('save-bar').style.display='none'; saveFnRef=null; }

// ─────────────────────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────────────────────
function set(h){ document.getElementById('mc').innerHTML=h; }
function v(id){ return document.getElementById(id)?.value??''; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseFM(raw) {
  const m=raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
  if(!m) return {body:raw};
  const fm={};
  m[1].split('\n').forEach(line=>{
    const i=line.indexOf(':');
    if(i<0)return;
    const k=line.slice(0,i).trim();
    const val=line.slice(i+1).trim().replace(/^["']|["']$/g,'');
    fm[k]=val;
  });
  if(fm.publicado!==undefined) fm.publicado=fm.publicado!=='false';
  fm.body=m[2].trim();
  return fm;
}
function buildFM(fm,body) {
  const skip=['body'];
  let out='---\n';
  for(const [k,vv] of Object.entries(fm)){
    if(skip.includes(k))continue;
    const s=String(vv);
    const quoted=s.includes(':')||s.includes('"')||s.includes("'")?`"${s.replace(/"/g,'\\"')}"`:s;
    out+=`${k}: ${quoted}\n`;
  }
  return out+`---\n\n${body}`;
}
